<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.container { max-width: 760px; margin: 0 auto; padding: 12px; }
.card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); }
.tap { cursor: pointer; } .tap:active { opacity: .8; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.tabs button, .seg button { padding: 11px 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; font-size: .9rem; cursor: pointer; }
.tabs button.on, .seg button.on { background: var(--btn-bg); color: #fff; border-color: var(--btn-bg); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; } .seg button { flex: 1; min-width: 70px; }
.badge { display: inline-block; font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 99px; margin: 2px 4px 2px 0; white-space: nowrap; }
.b-ok { background: #16a34a; color: #fff; } .b-bad { background: #dc2626; color: #fff; } .b-amber { background: #f59e0b; color: #111; } .b-grey { background: var(--surface-2); color: var(--text); }
.row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.big { font-size: 1.05rem; font-weight: 800; }
.small { font-size: .82rem; color: var(--muted); }
h2 { margin: 6px 0 10px; font-size: 1.15rem; } h3 { margin: 14px 0 6px; font-size: 1rem; }
label { display: block; margin: 8px 0 4px; font-size: .9rem; font-weight: 600; }
input, select, textarea { width: 100%; padding: 12px; min-height: 46px; font-size: 16px; box-sizing: border-box; }
textarea { min-height: 80px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.btn { min-height: 48px; } .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; } .btnrow .btn { flex: 1; }
.hidden { display: none !important; }
.ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 10px; overflow: auto; }
.ov.show { display: flex; } .ov .sheet { background: var(--card); color: var(--text); border-radius: 16px; width: 100%; max-width: 620px; padding: 16px; margin: auto 0; }
.grp { font-weight: 800; margin: 16px 0 6px; padding: 6px 8px; background: var(--surface-2); border-radius: 8px; }
.item { border-bottom: 1px solid var(--border); padding: 8px 0; }
.ans { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; }
.ans button { padding: 10px 2px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; font-size: .8rem; }
.ans button.on.ok { background: #16a34a; color: #fff; } .ans button.on.df { background: #dc2626; color: #fff; } .ans button.on.sv { background: #2563eb; color: #fff; } .ans button.on.na { background: #64748b; color: #fff; }
.ev { border-left: 4px solid var(--border); padding: 6px 10px; margin: 6px 0; }
.ev.pretrip { border-color: #2563eb; } .ev.wo { border-color: #dc2626; } .ev.inspection { border-color: #16a34a; } .ev.cost { border-color: #f59e0b; }
canvas.sig { width: 100%; height: 130px; border: 1px dashed var(--border); border-radius: 8px; background: #fff; touch-action: none; }
.notice { padding: 10px 12px; border-radius: 10px; border: 1px solid #f59e0b; margin: 8px 0; }
.err { color: var(--bad); font-weight: 700; margin-top: 6px; }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; } table.t td, table.t th { border-bottom: 1px solid var(--border); padding: 6px 4px; text-align: left; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } .tabs button { font-size: .8rem; } }
</style>
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<header style="background:#0f172a;color:white;padding:8px 10px;position:sticky;top:0;z-index:100;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;">
  <div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <h1 id="companyNameBanner" style="margin:0;font-size:1rem;font-weight:700;letter-spacing:1px;"></h1>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">
      <a href="index.html" onclick="location.replace('index.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Quote</a>
      <a href="dispatch.html" onclick="location.replace('dispatch.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Dispatch</a>
      <a href="invoices.html" onclick="location.replace('invoices.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Billing</a>
      <a href="scale.html" onclick="location.replace('scale.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Tickets</a>
      <a href="drivers.html" onclick="location.replace('drivers.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Drivers</a>
      <a href="trucks.html" onclick="location.replace('trucks.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Trucks</a>
      <a href="yards.html" onclick="location.replace('yards.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Inventory</a>
    </div>
  </div>
  <img id="companyLogo" alt="Logo" style="width:70px;height:70px;border-radius:8px;object-fit:contain;visibility:hidden;">
</header>
<div class="container">
  <div class="tabs" id="tabs">
    <button data-t="units" class="on">Units</button><button data-t="wo">Work orders</button><button data-t="due">Due soon</button><button data-t="pm">PM sheet</button>
  </div>
  <div id="note" class="small" style="margin:-4px 0 8px;"></div>
  <div id="view"></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
/* ======================================================================
   Trucks & Equipment (v14). Office: everything. Mechanic (signed in with name + passcode): Shop view
   (work orders, hours, parts, close). Anyone signed in: PM-A / PM-B sheets. Uses svc=trucks.
   ====================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const money = n => '$' + (+n || 0).toFixed(2);
const fmtN = n => (n === '' || n == null || isNaN(+n)) ? '—' : Math.round(+n).toLocaleString();
const newId = p => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dayOf = v => { const t = new Date(v); return isNaN(t) ? '' : t.toLocaleDateString('en-CA'); };
const LSJ = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let S = LSJ.get('kfTrucksCache', { units: [], wos: [], due: [], at: 0 }), tab = 'units', woFilter = 'open', admin = !!(window.kfIsAdmin && kfIsAdmin());
const roles = (window.kfRoles && kfRoles()) || [], person = window.kfPerson && kfPerson();
const isMech = () => admin || roles.includes('mechanic');
const call = body => kfCo.post('trucks', body);
function sheetOpen(html, mount) { $('sheet').innerHTML = html; $('ov').classList.add('show'); $('ov').scrollTop = 0; if (mount) mount($('sheet')); }
function sheetClose() { $('ov').classList.remove('show'); $('sheet').innerHTML = ''; }
$('ov').addEventListener('mousedown', e => { if (e.target === $('ov') && !$('ov').dataset.lock) sheetClose(); });
window.kfBack = function () { if ($('ov').classList.contains('show')) { sheetClose(); return true; } if (detail) { detail = null; render(); return true; } if (tab !== 'units' && tab !== defaultTab()) { setTab(defaultTab()); return true; } return false; };
function defaultTab() { return admin || !person ? 'units' : isMech() ? 'wo' : 'pm'; }

/* ---------- loading (cached for offline viewing) ---------- */
let serverOk = true;
async function load() {
  if (!kfCo.base()) { serverOk = false; $('view').innerHTML = '<div class="card">This device is not connected to the company yet. Office: open Quote and sign in. Drivers and the mechanic: open Drivers and log in.</div>'; return; }
  if (navigator.onLine === false) { $('note').textContent = 'No signal: showing what this phone saw last (' + (S.at ? new Date(S.at).toLocaleString() : 'nothing yet') + ').'; return; }
  try {
    const [u, w] = await Promise.all([call({ action: 'listUnits' }), call({ action: 'listWorkOrders', limit: 400 })]);
    if (u.status === 'error' && /Unknown part/.test(u.message || '')) { serverOk = false; $('view').innerHTML = '<div class="card"><div class="notice">The Trucks page needs the updated company script (Deploy → Manage deployments → pencil → New version).</div></div>'; return; }
    if (u.status === 'nokey') { $('view').innerHTML = '<div class="card">Sign in first: office devices with the company password, the mechanic and drivers on the Drivers page.</div>'; return; }
    if (u.status === 'ok') { S.units = u.units || []; admin = admin || !!u.admin; }
    if (w.status === 'ok') S.wos = w.workOrders || [];
    S.at = Date.now(); LSJ.set('kfTrucksCache', S); $('note').textContent = '';
  } catch (e) { $('note').textContent = 'Could not reach the company sheet. Showing the last saved copy.'; }
}
const unitById = id => S.units.find(u => String(u.id) === String(id));
const unitTitle = u => u ? (u.unitNo ? u.unitNo + ' · ' : '') + u.name : '?';
function statusBadge(u) { return u.status === 'Out of service' ? '<span class="badge b-bad">Out of service</span>' : u.status === 'Sold' ? '<span class="badge b-grey">Sold</span>' : '<span class="badge b-ok">In service</span>'; }
function dueBadge(u) { const d = (u.due || []).filter(x => x.lvl); if (!d.length) return ''; const red = d.some(x => x.lvl === 'red'); return `<span class="badge ${red ? 'b-bad' : 'b-amber'}">${red ? 'Overdue' : 'Due soon'} (${d.length})</span>`; }

/* ---------- tabs ---------- */
let detail = null;      // { kind: 'unit'|'wo', id }
function setTab(t) { tab = t; detail = null; [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.t === t)); render(); }
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t); });
function render() {
  if (!serverOk) return;
  if (detail && detail.kind === 'unit') return renderUnit(detail.id);
  if (detail && detail.kind === 'wo') return renderWO(detail.id);
  if (tab === 'units') return renderUnits();
  if (tab === 'wo') return renderWOs();
  if (tab === 'due') return renderDue();
  if (tab === 'pm') return renderPmPick();
}

/* ---------- 1. Units list ---------- */
function renderUnits() {
  const groups = [['truck', 'Trucks'], ['trailer', 'Trailers'], ['equipment', 'Equipment']];
  const show = S.units.filter(u => u.status !== 'Sold' || showSold);
  $('view').innerHTML = (admin ? `<div class="btnrow" style="margin-top:0"><button class="btn" onclick="editUnit()">+ Add unit</button>${admin ? '<button class="btn btn-outline" onclick="openSettings()">PM intervals &amp; sheets</button>' : ''}</div>` : '') +
    groups.map(g => { const list = show.filter(u => (u.type || 'truck') === g[0]); if (!list.length) return ''; return `<h3>${g[1]}</h3>` + list.map(u => `
      <div class="card tap" onclick="openUnit('${esc(u.id)}')">
        <div class="row"><span class="big">${esc(unitTitle(u))}</span><span>${statusBadge(u)}</span></div>
        <div class="small">${u.currentOdo !== '' && u.currentOdo != null ? fmtN(u.currentOdo) + ' km' : ''}${u.trackHours === 'yes' ? ' · ' + fmtN(u.currentHours) + ' h' : ''}${u.plate ? ' · ' + esc(u.plate) : ''}</div>
        <div>${u.openWOs ? `<span class="badge ${u.openMajor ? 'b-bad' : 'b-grey'}">${u.openWOs} open work order${u.openWOs > 1 ? 's' : ''}</span>` : ''}${dueBadge(u)}${u.status === 'Out of service' && u.outReason ? `<span class="small">${esc(u.outReason)}</span>` : ''}</div>
      </div>`).join(''); }).join('') +
    (S.units.some(u => u.status === 'Sold') ? `<button class="btn btn-outline" style="width:100%" onclick="showSold=!showSold;render()">${showSold ? 'Hide' : 'Show'} sold units</button>` : '') +
    (!S.units.length ? '<div class="card small">No units yet.' + (admin ? ' Tap Add unit. Trucks set up in Drivers → Settings are copied here by themselves.' : '') + '</div>' : '');
}
let showSold = false;
function openUnit(id) { detail = { kind: 'unit', id, sub: 'info' }; render(); window.scrollTo(0, 0); }

/* ---------- 2. Unit detail ---------- */
async function renderUnit(id) {
  const u = unitById(id); if (!u) { detail = null; return render(); }
  const sub = detail.sub || 'info';
  const subs = [['info', 'Info'], ['history', 'History'], ['plan', 'Service plan']].concat(admin ? [['costs', 'Costs']] : []);
  $('view').innerHTML = `<button class="btn btn-outline" onclick="detail=null;render()">&larr; All units</button>
    <div class="card" style="margin-top:10px"><div class="row"><span class="big">${esc(unitTitle(u))}</span>${statusBadge(u)}</div>
    <div class="small">${esc(u.type || 'truck')}${u.make ? ' · ' + esc(u.make) + ' ' + esc(u.model || '') : ''}${u.year ? ' · ' + esc(u.year) : ''} · ${fmtN(u.currentOdo)} km${u.trackHours === 'yes' ? ' · ' + fmtN(u.currentHours) + ' h' : ''}</div>
    ${(u.due || []).filter(x => x.lvl).map(x => `<div class="small" style="color:${x.lvl === 'red' ? '#dc2626' : '#b45309'};font-weight:700">${esc(x.text)}</div>`).join('')}
    ${(u.due || []).filter(x => x.kind === 'pm' && !x.lvl).map(x => `<div class="small">${esc(x.text)}</div>`).join('')}
    <div class="btnrow"><button class="btn" onclick="startPm('${esc(u.id)}')">PM sheet</button><button class="btn btn-outline" onclick="enterHours('${esc(u.id)}')">Enter ${u.trackHours === 'yes' ? 'hours / km' : 'km'}</button>${isMech() ? `<button class="btn btn-outline" onclick="newWO('${esc(u.id)}')">New work order</button>` : ''}</div></div>
    <div class="seg">${subs.map(s => `<button class="${s[0] === sub ? 'on' : ''}" onclick="detail.sub='${s[0]}';render()">${s[1]}</button>`).join('')}</div><div id="sub"></div>`;
  const box = $('sub');
  if (sub === 'info') return unitInfo(u, box);
  if (sub === 'history') return unitHistory(u, box);
  if (sub === 'plan') return unitPlan(u, box);
  if (sub === 'costs') return unitCosts(u, box);
}
function expiry(label, v) {
  if (!v) return `<tr><td>${label}</td><td>—</td></tr>`;
  const days = Math.round((new Date(v) - Date.now()) / 86400000), col = days < 0 ? '#dc2626' : days <= 30 ? '#b45309' : '';
  return `<tr><td>${label}</td><td style="color:${col};font-weight:${col ? 800 : 400}">${esc(v)}${days < 0 ? ' (EXPIRED)' : days <= 30 ? ' (in ' + days + ' days)' : ''}</td></tr>`;
}
function unitInfo(u, box) {
  const f = (k, l) => u[k] !== '' && u[k] != null ? `<tr><td>${l}</td><td>${esc(u[k])}</td></tr>` : '';
  box.innerHTML = `<div class="card">${u.photo ? `<img src="${esc(u.photo)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-bottom:8px">` : ''}
    <table class="t">${f('unitNo', 'Unit #')}${f('plate', 'Plate')}${f('vin', 'VIN')}${f('make', 'Make')}${f('model', 'Model')}${f('year', 'Year')}${f('purchaseDate', 'Bought')}${admin ? f('purchasePrice', 'Price paid') : ''}
    ${f('trailerA', 'Trailer A')}${f('trailerB', 'Trailer B')}${f('pricingUnit', 'Pricing unit (Quote)')}<tr><td>Tracks engine hours</td><td>${u.trackHours === 'yes' ? 'Yes' : 'No'}</td></tr>
    ${u.type === 'truck' ? `<tr><td>Loader crane</td><td>${u.hasCrane === 'yes' ? 'Yes' : 'No'}</td></tr>` : ''}
    ${u.type === 'equipment' ? f('fuelBurnLph', 'Fuel burn (L/engine hour)') + f('fuelType', 'Fuel type') + (admin ? f('wearPerHour', 'Wear &amp; ownership $/engine hour') : '') : ''}
    ${expiry('Registration', u.regExpiry)}${expiry('Insurance', u.insExpiry)}${expiry('CVIP', u.cvipExpiry)}${f('homeBase', 'Home base')}${f('notes', 'Notes')}</table>
    ${u.status === 'Out of service' && admin ? `<div class="notice">${u.oosOverride ? 'Drivers are ALLOWED to use it (office override ' + esc(u.oosOverride) + ').' : 'Drivers cannot start a shift on it.'}<button class="btn btn-outline" style="width:100%;margin-top:8px" onclick="toggleOverride('${esc(u.id)}', ${u.oosOverride ? 'false' : 'true'})">${u.oosOverride ? 'Turn the override off' : 'Let drivers use it anyway (until I turn this off)'}</button></div>` : ''}
    ${admin ? `<div class="btnrow"><button class="btn" onclick="editUnit('${esc(u.id)}')">Edit unit</button>${u.status !== 'Sold' ? `<button class="btn btn-outline" style="color:var(--bad)" onclick="sellUnit('${esc(u.id)}')">Mark sold</button>` : ''}</div>` : ''}</div>`;
}
async function toggleOverride(id, on) {
  if (!confirm(on ? 'Let drivers start shifts on this out-of-service unit until you turn this off?' : 'Stop drivers using this unit again?')) return;
  const r = await call({ action: 'setOverride', unitId: id, on }); if (r.status !== 'ok') return alert(r.message || 'Not saved.');
  await load(); render();
}
async function sellUnit(id) { const u = unitById(id); if (!confirm(`Mark ${u.name} as sold? It stays in the records (nothing is deleted).`)) return; const r = await call({ action: 'deleteUnit', id }); if (r.status !== 'ok') return alert(r.message || 'Not saved.'); await load(); detail = null; render(); }
async function unitHistory(u, box) {
  box.innerHTML = '<div class="small">Loading…</div>';
  let r; try { r = await call({ action: 'unitHistory', unitId: u.id }); } catch (e) { box.innerHTML = '<div class="card small">Needs signal.</div>'; return; }
  if (r.status !== 'ok') { box.innerHTML = `<div class="card small">${esc(r.message || r.status)}</div>`; return; }
  box.innerHTML = (r.events || []).map(e => `<div class="ev ${e.kind} ${e.shiftId || e.id ? 'tap' : ''}" ${e.kind === 'pretrip' ? `onclick="openPretrip('${esc(e.shiftId)}')"` : e.kind === 'wo' ? `onclick="openWO('${esc(e.id)}')"` : e.kind === 'inspection' ? `onclick="openInspection('${esc(e.id)}')"` : ''}>
    <div class="small">${esc(new Date(e.at).toLocaleString())}</div><div>${esc(e.text)}</div>${e.photo ? `<a href="${esc(e.photo)}" target="_blank" rel="noopener" class="small">receipt</a>` : ''}</div>`).join('') || '<div class="card small">Nothing recorded yet.</div>';
}
async function openPretrip(shiftId) {
  sheetOpen('<h3>Loading…</h3>');
  const r = await call({ action: 'getPretrip', shiftId }); if (r.status !== 'ok') return sheetOpen(`<p>${esc(r.message)}</p><button class="btn" onclick="sheetClose()">Close</button>`);
  const p = r.pretrip || {};
  sheetOpen(`<h3>Pre-trip · ${esc(r.driverName)} · ${esc(r.unit)}</h3><div class="small">${esc(new Date(r.at).toLocaleString())}</div>
    <p><b>${p.defects ? 'DEFECTS: ' + esc((p.defectList || []).join(', ')) : 'All OK'}</b></p>${p.defectNote ? `<p>${esc(p.defectNote)}</p>` : ''}
    ${(p.defectItems || []).map(d => `<div>${esc(d.item)} · <b>${esc(d.severity || 'minor')}</b>${d.known ? ' (already known)' : ''}</div>`).join('')}
    ${r.signature ? `<img src="${esc(r.signature)}" style="max-width:240px;background:#fff">` : ''}<div class="btnrow"><button class="btn" onclick="sheetClose()">Close</button></div>`);
}
async function openInspection(id) {
  sheetOpen('<h3>Loading…</h3>');
  const r = await call({ action: 'getInspection', id }); if (r.status !== 'ok') return sheetOpen(`<p>${esc(r.message)}</p><button class="btn" onclick="sheetClose()">Close</button>`);
  const x = r.inspection, items = JSON.parse(x.itemsJson || '[]');
  sheetOpen(`<h3>${esc(tplName(x.template))} · ${esc(x.unitName)}</h3><div class="small">${esc(new Date(x.doneAt).toLocaleString())} · ${esc(x.doneBy)} (${esc(x.role)}) · ${fmtN(x.odo)} km · ${fmtN(x.hours)} h · <b>${esc(x.result)}</b></div>
    <table class="t">${items.filter(i => i.a !== 'ok').map(i => `<tr><td>${esc(i.t)}</td><td><b>${esc(ANS[i.a] || i.a)}</b>${i.sev ? ' (' + esc(i.sev) + ')' : ''}${i.v ? ' · ' + esc(i.v) : ''}${i.note ? '<br>' + esc(i.note) : ''}${i.photo ? ` <a href="${esc(i.photo)}" target="_blank" rel="noopener">photo</a>` : ''}</td></tr>`).join('') || '<tr><td>Every item OK</td></tr>'}</table>
    ${x.signature ? `<img src="${esc(x.signature)}" style="max-width:240px;background:#fff;margin-top:8px">` : ''}<div class="btnrow"><button class="btn" onclick="sheetClose()">Close</button></div>`);
}
async function unitPlan(u, box) {
  box.innerHTML = '<div class="small">Loading…</div>';
  let r; try { r = await call({ action: 'listServicePlans', unitId: u.id }); } catch (e) { box.innerHTML = '<div class="card small">Needs signal.</div>'; return; }
  const plans = r.plans || [], dues = (u.due || []).filter(x => x.kind === 'service');
  box.innerHTML = `<div class="card"><b>PM sheets</b>${(u.due || []).filter(x => x.kind === 'pm').map(x => `<div class="small" style="${x.lvl === 'red' ? 'color:#dc2626;font-weight:700' : x.lvl ? 'color:#b45309;font-weight:700' : ''}">${esc(x.text)}</div>`).join('') || '<div class="small">No PM intervals for this unit type.</div>'}</div>` +

async function unitCosts(u, box) {

    const fuel = sum(x => x.source === 'fuel'), other = sum(x => x.source !== 'fuel' && x.source !== 'workorder'), total = r2(inhouse + parts + shop + fuel + other);
    const rd = r.readings.filter(x => inR(x.at)), km = rd.length ? Math.max(...rd.map(x => +x.odo || 0)) - Math.min(...rd.filter(x => +x.odo).map(x => +x.odo)) : 0, hr = rd.length ? Math.max(...rd.map(x => +x.hours || 0)) - Math.min(...rd.filter(x => +x.hours).map(x => +x.hours)) : 0;

  await load(); await flushQueue(false);
  const h = location.hash.replace('#', ''), m = /^(unit|wo|pm|due)=?(.*)$/.exec(h);
  if (m) { const id = decodeURIComponent(m[2] || ''); if (m[1] === 'unit' && id) openUnit(id); else if (m[1] === 'wo' && id) openWO(id); else if (m[1] === 'pm') { setTab('pm'); if (id) startPm(id); } else if (m[1] === 'due') setTab('due'); else render(); }
  else render();
  if (window.kfLive) kfLive(async () => { if ($('ov').classList.contains('show')) return; await load(); render(); }, { ms: 60000 });
})();
</script>
