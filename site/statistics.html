<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script src="kf-config.js"></script>
<script src="nav.js"></script>
<script src="kf-stats.js"></script>
<style>
.container { max-width: 900px; margin: 0 auto; padding: 12px; }
.card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
.tabs button, .seg button { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; font-size: .88rem; cursor: pointer; white-space: nowrap; }
.tabs button.on, .seg button.on { background: var(--btn-bg); color: #fff; border-color: var(--btn-bg); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.chartbox { background: #ffffff; border-radius: 12px; border: 1px solid #cbd5e1; padding: 8px 6px 4px; position: relative; color: #0f172a; }
.legend { display: flex; gap: 14px; justify-content: center; font-size: .82rem; font-weight: 700; color: #0f172a; margin: 2px 0 4px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.tip { position: absolute; pointer-events: none; background: #0f172a; color: #fff; font-size: .8rem; padding: 7px 9px; border-radius: 8px; white-space: nowrap; display: none; z-index: 3; line-height: 1.45; }
.big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.big3 div { border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; background: var(--card); border: 1px solid var(--border); }
.big3 b { display: block; font-size: 1.25rem; } .big3 span { font-size: .78rem; color: var(--muted); }
.k-sales { color: #15803d; } .k-costs { color: #dc2626; } .k-profit { color: #2563eb; }
table.t { width: 100%; border-collapse: collapse; font-size: .86rem; } table.t th, table.t td { border-bottom: 1px solid var(--border); padding: 7px 5px; text-align: right; white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; white-space: normal; } table.t th { cursor: pointer; font-size: .78rem; color: var(--muted); }
table.t tr.tap { cursor: pointer; } table.t tr.tap:active { background: var(--surface-2); }
.scroll { overflow-x: auto; } .good { color: #15803d; font-weight: 700; } .bad { color: #dc2626; font-weight: 700; }
.small { font-size: .8rem; color: var(--muted); } .num { cursor: pointer; text-decoration: underline dotted; }
label { display: block; margin: 8px 0 4px; font-size: .9rem; font-weight: 600; }
input, select, textarea { width: 100%; padding: 12px; min-height: 46px; font-size: 16px; box-sizing: border-box; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; } @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .big3 b { font-size: 1.05rem; } }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; } .btnrow .btn { flex: 1; }
.ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 10px; overflow: auto; }
.ov.show { display: flex; } .ov .sheet { background: var(--card); color: var(--text); border-radius: 16px; width: 100%; max-width: 760px; padding: 16px; margin: auto 0; }
.hidden { display: none !important; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; margin: 6px 0; } .filters select, .filters input { min-height: 40px; padding: 8px; font-size: 14px; }
.row { display: flex; justify-content: space-between; gap: 8px; }
</style>
</head>
<body>
<header style="background:#0f172a;color:white;padding:8px 10px;position:sticky;top:0;z-index:100;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;">
  <div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><h1 id="companyNameBanner" style="margin:0;font-size:1rem;font-weight:700;letter-spacing:1px;"></h1></div>
    <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:3px;">
      <a href="index.html" onclick="location.replace('index.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Quote</a>
      <a href="dispatch.html" onclick="location.replace('dispatch.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Dispatch</a>
      <a href="invoices.html" onclick="location.replace('invoices.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Billing</a>
      <a href="scale.html" onclick="location.replace('scale.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Tickets</a>
      <a href="drivers.html" onclick="location.replace('drivers.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Drivers</a>
      <a href="trucks.html" onclick="location.replace('trucks.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Trucks</a>
      <a href="yards.html" onclick="location.replace('yards.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Inventory</a>
      <a href="statistics.html" onclick="location.replace('statistics.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Statistics</a>
    </div>
  </div>
  <img id="companyLogo" alt="Logo" style="width:70px;height:70px;border-radius:8px;object-fit:contain;visibility:hidden;">
</header>
<div class="container">
  <div class="tabs" id="tabs">
    <button data-t="home" class="on">Bottom line</button><button data-t="add">Add expense</button><button data-t="rec">Recurring bills</button><button data-t="brk">Breakdowns</button>
    <button data-t="cmp">Comparisons</button><button data-t="acc">Quote accuracy</button><button data-t="over">Overhead</button><button data-t="exp">Export</button>
  </div>
  <div id="note" class="small" style="margin:-4px 0 8px;"></div>
  <div id="view"></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
/* ======================================================================
   Statistics (v14): the company's own bottom line. Office only. One svc=money summary call; all maths here (kf-stats.js).
   ====================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const { r2, num, day } = KFS;
const money = n => (n < 0 ? '-$' : '$') + Math.abs(+n || 0).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = n => (n < 0 ? '-$' : '$') + Math.round(Math.abs(+n || 0)).toLocaleString('en-CA');
const short$ = n => { const a = Math.abs(n), s = n < 0 ? '-$' : '$'; return a >= 1e6 ? s + (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? s + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k' : s + Math.round(a); };
const QS = () => { try { return JSON.parse(localStorage.getItem('knightForestrySettings_v3') || '{}'); } catch (e) { return {}; } };
const LSJ = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { try { localStorage.removeItem(k); } catch (er) {} } } };
let DATA = null, M = null, view = LSJ.get('kfStatsView', 'month'), anchor = new Date(), tab = 'home', overhead = LSJ.get('kfStatsOverhead', true);
function sheetOpen(html, mount) { $('sheet').innerHTML = html + '<div class="btnrow"><button class="btn" onclick="sheetClose()">Close</button></div>'; $('ov').classList.add('show'); $('ov').scrollTop = 0; if (mount) mount($('sheet')); }
function sheetClose() { $('ov').classList.remove('show'); }
$('ov').addEventListener('mousedown', e => { if (e.target === $('ov')) sheetClose(); });
window.kfBack = function () { if ($('ov').classList.contains('show')) { sheetClose(); return true; } if (tab !== 'home') { setTab('home'); return true; } return false; };

/* ---------- data: one summary call (cached for offline viewing) ---------- */
async function moneyPost(body) {
  let r = await kfCo.post('money', body);
  if (r.status === 'badpassword' || r.status === 'noadmin') { const pw = await kfAskPassword('Statistics is office only. Company password:'); if (!pw) return { status: 'cancelled' }; r = await kfCo.post('money', kfAuth(Object.assign({}, body, { password: pw }))); }
  return r;
}
async function load(force) {
  const cache = LSJ.get('kfStatsCache', null);
  if (cache && !DATA) { DATA = cache.data; M = KFS.prep(DATA, QS()); $('note').textContent = 'Last loaded ' + new Date(cache.at).toLocaleString() + (navigator.onLine === false ? ' (no signal: showing the saved copy)' : ''); }
  if (navigator.onLine === false && !force) return;
  try {
    const from = day(new Date(new Date().getFullYear() - 2, 0, 1));
    const r = await moneyPost({ action: 'summary', from });
    if (r.status === 'ok') { DATA = r; M = KFS.prep(DATA, QS()); $('note').textContent = 'Up to date ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); LSJ.set('kfStatsCache', { at: Date.now(), data: r }); }
    else if (r.status === 'error' && /Unknown part/.test(r.message || '')) $('note').textContent = 'Statistics needs the updated company script.';
    else if (r.status !== 'cancelled' && !DATA) $('note').textContent = r.message || 'Could not load.';
  } catch (e) { if (!DATA) $('note').textContent = 'No signal and nothing saved yet.'; }
}

/* ---------- tabs ---------- */
function setTab(t) { tab = t; [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.t === t)); render(); window.scrollTo(0, 0); }
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t); });
function render() {
  if (tab === 'add') return renderAdd();
  if (tab === 'rec') return renderRecurring();
  if (!M) { $('view').innerHTML = '<div class="card">Loading…</div>'; return; }
  ({ home: renderHome, brk: renderBreakdowns, cmp: renderComparisons, acc: renderAccuracy, over: renderOverhead, exp: renderExport })[tab]();
}
function periodRange() { const b = KFS.buckets(view, anchor, num(M.money.weekStartsOn)); return { from: b[0].from, to: b[b.length - 1].to, label: periodLabel() }; }
function periodLabel() { const a = new Date(anchor); if (view === 'week') { const b = KFS.buckets('week', a, num(M.money.weekStartsOn)); return 'Week of ' + new Date(b[0].from + 'T12:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); } if (view === 'month') return a.toLocaleDateString('en-CA', { month: 'long', year: 'numeric' }); if (view === 'quarter') return 'Q' + (Math.floor(a.getMonth() / 3) + 1) + ' ' + a.getFullYear(); return String(a.getFullYear()); }
const P = () => { const r = periodRange(); return KFS.period(M, r.from, r.to, { overhead }); };

/* ---------- 1. Bottom line: graph first ---------- */
function controlsHtml() {
  return `<div class="seg">${[['week', 'Week'], ['month', 'Month'], ['quarter', 'Quarter'], ['year', 'Year']].map(v => `<button class="${view === v[0] ? 'on' : ''}" data-v="${v[0]}">${v[1]}</button>`).join('')}</div>
    <div class="row" style="align-items:center;margin:4px 0 8px"><button class="btn btn-outline btn-sm" id="prevP" aria-label="Previous">&lt;</button><b id="pLabel">${esc(periodLabel())}</b><span><button class="btn btn-outline btn-sm" id="todayP">Today</button> <button class="btn btn-outline btn-sm" id="nextP" aria-label="Next">&gt;</button></span></div>`;
}
function bindControls(redraw) {
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { view = b.dataset.v; LSJ.set('kfStatsView', view); redraw(); });
  $('prevP').onclick = () => { anchor = KFS.shiftAnchor(view, anchor, -1); redraw(); };
  $('nextP').onclick = () => { anchor = KFS.shiftAnchor(view, anchor, 1); redraw(); };
  $('todayP').onclick = () => { anchor = new Date(); redraw(); };
}
function renderHome() {
  const s = KFS.series(M, view, anchor, { overhead }), p = s.all, T = p.totals;
  const owed = owedToUs();
  $('view').innerHTML = controlsHtml() + `<div class="chartbox"><div class="legend"><span><i style="background:#15803d"></i>Sales</span><span><i style="background:#dc2626"></i>Costs</span><span><i style="background:#2563eb"></i>Net profit</span></div>
    <div id="chart"></div><div class="tip" id="tip"></div></div>
    <div class="big3"><div data-drill="sales"><span>Sales</span><b class="k-sales">${money0(T.sales)}</b></div><div data-drill="costs"><span>Costs</span><b class="k-costs">${money0(T.costs)}</b></div><div data-drill="profit"><span>Net profit</span><b class="k-profit">${money0(T.profit)}</b><span>${T.margin}% margin</span></div></div>
    <div class="small" style="margin-top:6px">Before GST. Sales = completed invoices. Costs = wood sold, wages (incl. ${num(M.money.employerCostPct)}% employer cost and overtime), fuel, repairs and every expense.</div>
    <div class="card" style="margin-top:10px"><div class="row"><span>Cash in (payments received)</span><b class="num" data-drill="cash">${money(T.cashIn)}</b></div><div class="row"><span>Owed to us (all unpaid invoices)</span><b class="num" data-drill="owed">${money(owed.total)}</b></div>
      <div class="row"><span>GST collected / GST paid</span><b>${money(T.gstIn)} / ${money(T.gstOut)}</b></div></div>
    <div class="card"><h3 style="margin:0 0 6px">Where the money went</h3><div id="flow"></div>
      <table class="t" style="margin-top:8px"><tr><th>Cost category</th><th>$</th><th>% of sales</th></tr>${Object.keys(p.byCat).sort((a, b) => p.byCat[b] - p.byCat[a]).map(c => `<tr class="tap" data-cat="${esc(c)}"><td>${esc(c)}</td><td>${money(p.byCat[c])}</td><td>${T.sales ? (p.byCat[c] / T.sales * 100).toFixed(1) + '%' : '—'}</td></tr>`).join('')}
      <tr><td><i>Empty driving $ (not billed, included in the lines above)</i></td><td>${money(p.loads.reduce((t, x) => t + (x.empty ? Math.max(0, x.empty.emptyCost) : 0), 0))}</td><td></td></tr></table></div>`;
  bindControls(renderHome);
  drawChart($('chart'), s.buckets);
  drawFlow($('flow'), T, p.byCat);
  document.querySelectorAll('[data-drill]').forEach(el => el.onclick = () => drill(el.dataset.drill, p, owed));
  document.querySelectorAll('[data-cat]').forEach(el => el.onclick = () => drill('cat:' + el.dataset.cat, p));
}
// Line graph in plain SVG: Sales green, Costs red, Net profit blue (3 px, dots), $0 line, short $ labels, tap/drag tooltip
function drawChart(box, B) {
  const W = Math.max(320, box.clientWidth || 600), H = 260, L = 46, R = 44, T = 10, Bm = 28, w = W - L - R, h = H - T - Bm;
  const vals = B.flatMap(b => [b.sales, b.costs, b.profit]); let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); if (hi === lo) hi = lo + 100;
  // round axis steps ($500, $1k, $2.5k ...)
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= raw) || raw;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
  const X = i => L + (B.length === 1 ? w / 2 : i * w / (B.length - 1)), Y = v => T + (hi - v) / (hi - lo) * h;
  const grid = []; for (let g = lo; g <= hi + step / 2; g += step) grid.push(g);
  const line = (k, c) => `<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${B.map((b, i) => X(i) + ',' + Y(b[k])).join(' ')}"/>` + B.map((b, i) => `<circle cx="${X(i)}" cy="${Y(b[k])}" r="4.5" fill="${c}" stroke="#fff" stroke-width="2"/>`).join('');
  // direct labels at the right end, nudged apart so they never sit on top of each other
  const lastI = B.length - 1, ends = [['sales', 'Sales'], ['costs', 'Costs'], ['profit', 'Profit']].map(x => ({ t: x[1], y: Y(B[lastI][x[0]]) + 4 })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 12) ends[i].y = ends[i - 1].y + 12;
  const over = ends[ends.length - 1].y - (T + h + 2); if (over > 0) ends.forEach(e => { e.y -= over; });
  const endLab = (k) => { const e = ends.find(x => x.t === k); return `<text x="${X(lastI) + 6}" y="${e.y}" font-size="11" font-weight="700" fill="#0f172a">${e.t}</text>`; };
  const every = Math.ceil(B.length / 7);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;font-family:Arial,sans-serif" role="img" aria-label="Sales, costs and net profit">
    ${grid.map(g => `<line x1="${L}" x2="${L + w}" y1="${Y(g)}" y2="${Y(g)}" stroke="#e2e8f0"/><text x="${L - 6}" y="${Y(g) + 4}" font-size="11" text-anchor="end" fill="#334155">${short$(g)}</text>`).join('')}
    <line x1="${L}" x2="${L + w}" y1="${Y(0)}" y2="${Y(0)}" stroke="#475569" stroke-width="1"/>
    ${B.map((b, i) => i % every === 0 || i === lastI ? `<text x="${X(i)}" y="${H - 8}" font-size="11" text-anchor="middle" fill="#334155">${esc(b.label)}</text>` : '').join('')}
    ${line('costs', '#dc2626')}${line('sales', '#15803d')}${line('profit', '#2563eb')}
    ${endLab('Sales')}${endLab('Costs')}${endLab('Profit')}
    <line id="xh" x1="0" x2="0" y1="${T}" y2="${T + h}" stroke="#94a3b8" stroke-dasharray="3 3" style="display:none"/>
    <rect x="${L - 10}" y="0" width="${w + 20}" height="${H}" fill="transparent" id="hit"/></svg>`;
  const svg = box.querySelector('svg'), tip = $('tip'), xh = box.querySelector('#xh');
  const at = e => { const r = svg.getBoundingClientRect(), x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * W / r.width; let best = 0; B.forEach((b, i) => { if (Math.abs(X(i) - x) < Math.abs(X(best) - x)) best = i; }); return best; };
  const show = e => { const i = at(e), b = B[i], r = svg.getBoundingClientRect(); xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.style.display = '';
    tip.innerHTML = `<b>${esc(b.from === b.to ? b.from : b.from + ' to ' + b.to)}</b><br><span style="color:#86efac">Sales ${money(b.sales)}</span><br><span style="color:#fca5a5">Costs ${money(b.costs)}</span><br><span style="color:#93c5fd">Profit ${money(b.profit)}</span><br><span style="opacity:.7">tap again for the rows</span>`;
    tip.style.display = 'block'; const px = X(i) / W * r.width; tip.style.left = Math.min(Math.max(4, px - 70), r.width - 150) + 'px'; tip.style.top = '30px'; return i; };
  let lastTap = -1;
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', e => { const i = show(e); if (i === lastTap) bucketRows(B[i]); lastTap = i; });
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.style.display = 'none'; });
}
function bucketRows(b) {
  sheetOpen(`<h3>${esc(b.from === b.to ? b.from : b.from + ' to ' + b.to)}</h3><div class="row"><span class="k-sales">Sales ${money(b.sales)}</span><span class="k-costs">Costs ${money(b.costs)}</span><span class="k-profit">Profit ${money(b.profit)}</span></div>` +
    salesTable(b.salesRows) + costsTable(b.costRows));
}
// "where the money went": revenue sources -> sales -> costs + profit (plain SVG flow)
function drawFlow(box, T, byCat) {
  const W = Math.max(320, box.clientWidth || 600), H = 220, src = [['Product', T.product, '#15803d'], ['Trucking', T.trucking, '#16a34a'], ['FSC', T.fsc, '#4ade80']].filter(x => x[1] > 0);
  const nm = c => c.replace(' (cost of goods)', '').replace('Repairs - ', 'Repairs ').replace('Wages - ', 'Wages '), cats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]), dst = cats.slice(0, 6).map(c => [nm(c), byCat[c], '#dc2626']);
  const rest = cats.slice(6).reduce((t, c) => t + byCat[c], 0); if (rest > 0) dst.push(['Other costs', rest, '#ef4444']);
  dst.push([T.profit >= 0 ? 'Net profit' : 'Loss', Math.abs(T.profit), '#2563eb']);
  const tot = Math.max(T.sales, dst.reduce((t, x) => t + x[1], 0)) || 1, k = (H - 20) / tot, gap = 3;
  let y1 = 10, y2 = 10; const L = W * 0.3, R = W * 0.52;
  const left = src.map(x => { const o = { y: y1, h: Math.max(2, x[1] * k), x }; y1 += o.h + gap; return o; }), right = dst.map(x => { const o = { y: y2, h: Math.max(2, x[1] * k), x }; y2 += o.h + gap; return o; });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${Math.max(y1, y2) + 10}" width="100%" style="display:block;font-family:Arial,sans-serif;font-size:10.5px">
    ${left.map(o => `<rect x="${L - 14}" y="${o.y}" width="14" height="${o.h}" rx="2" fill="${o.x[2]}"/><text x="${L - 18}" y="${o.y + o.h / 2 + 4}" text-anchor="end" fill="currentColor">${esc(o.x[0])} ${short$(o.x[1])}</text>`).join('')}

    if (typeof html2pdf === 'undefined') { try { await kfPdfLib(); } catch (e) { return alert('The PDF tool could not load. Check your signal and try again.'); } }
    const html = `<div style="font-family:Arial;color:#0f172a;padding:10px;width:700px"><h2>${esc((JSON.parse(localStorage.getItem('kfCompany') || '{}').name) || '')} · Statistics · ${esc(periodLabel())}</h2>
      <table style="width:100%;border-collapse:collapse" border="1" cellpadding="5"><tr><td>Sales (before GST)</td><td>${money(T.sales)}</td></tr><tr><td>Costs</td><td>${money(T.costs)}</td></tr><tr><td><b>Net profit</b></td><td><b>${money(T.profit)} (${T.margin}%)</b></td></tr><tr><td>Cash in</td><td>${money(T.cashIn)}</td></tr><tr><td>GST collected / paid</td><td>${money(T.gstIn)} / ${money(T.gstOut)}</td></tr></table>
      <h3>Costs by category</h3><table style="width:100%;border-collapse:collapse" border="1" cellpadding="4">${Object.keys(p.byCat).map(c => `<tr><td>${esc(c)}</td><td>${money(p.byCat[c])}</td></tr>`).join('')}</table>
      <h3>Per load</h3><table style="width:100%;border-collapse:collapse;font-size:11px" border="1" cellpadding="3"><tr><th>Load</th><th>Sales</th><th>Wood</th><th>Driver</th><th>Fuel</th><th>Truck</th><th>Overhead</th><th>Profit</th></tr>${p.loads.map(x => `<tr><td>${esc(x.l.loadId)} ${esc(x.l.customerName)}</td><td>${money(x.rev)}</td><td>${money(x.wood)}</td><td>${money(x.wage)}</td><td>${money(x.fuel)}</td><td>${money(x.truck)}</td><td>${money(x.over)}</td><td>${money(x.profit)}</td></tr>`).join('')}</table></div>`;
    const el = document.createElement('div'); el.innerHTML = html; document.body.appendChild(el);
    try { const blob = await html2pdf().set({ margin: 8, jsPDF: { unit: 'mm', format: 'letter' }, html2canvas: { scale: 2, backgroundColor: '#ffffff' } }).from(el.firstChild).outputPdf('blob'); const f = new File([blob], 'Statistics ' + periodLabel().replace(/[^\w]+/g, '_') + '.pdf', { type: 'application/pdf' }); if (!(window.kfShareFile && await kfShareFile(f, 'Statistics'))) dl(f); }
    catch (e) { alert('Could not make the PDF: ' + e.message); } finally { el.remove(); }
  };
}

/* ---------- start ---------- */
(async function boot() {
  if (!(window.kfIsAdmin && kfIsAdmin()) && !localStorage.getItem('kfKey')) { $('view').innerHTML = '<div class="card">Statistics is for office devices only.</div>'; return; }
  render(); await load(); render();
})();
</script>
