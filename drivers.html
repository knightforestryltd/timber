<style>
.container { max-width: 720px; margin: 0 auto; padding: 12px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
.small { font-size: .82rem; color: var(--muted); }
label { display: block; margin: 10px 0 4px; font-size: .9rem; }
input, select, textarea { width: 100%; padding: 12px; min-height: 46px; margin-bottom: 4px; font-size: 16px; }
textarea { min-height: 80px; }
.hidden { display: none !important; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.tabs button { padding: 12px 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; font-size: 1rem; cursor: pointer; }
.tabs button.on { background: var(--btn-bg); color: #fff; border-color: var(--btn-bg); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 2px solid var(--primary-light); background: var(--card); }
.stat .big { font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
.stat .sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.stat.D { border-color: var(--good); } .stat.ON { border-color: var(--amber); } .stat.OFF, .stat.SB { border-color: var(--primary-light); }
.sbtn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.sbtn { min-height: 74px; border-radius: 14px; border: 2px solid var(--border); background: var(--card); color: var(--text); font-size: 1.1rem; font-weight: 800; cursor: pointer; }
.sbtn small { display: block; font-weight: 500; font-size: .75rem; color: var(--muted); }
.sbtn.cur { background: var(--btn-bg); color: #fff; border-color: var(--btn-bg); } .sbtn.cur small { color: #dbeafe; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.meter { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.meter .lab { font-size: .78rem; color: var(--muted); } .meter .val { font-weight: 800; font-size: 1.05rem; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--good); }
.meter.warn .bar > i { background: var(--amber); } .meter.over .bar > i { background: var(--bad); } .meter.over .val { color: var(--bad); }
.act { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; padding: 14px 16px; min-height: 56px; margin-bottom: 8px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
.act .tag { font-size: .8rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text); }
.act .tag.ok { background: #dcfce7; color: #14532d; } .act .tag.bad { background: var(--out-bg); color: #7f1d1d; } .act .tag.todo { background: var(--warn-bg); color: var(--warn-text); }
.notice { padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); font-size: .92rem; }
.notice.bad { background: var(--out-bg); color: #7f1d1d; border-color: var(--bad); } .notice.good { background: #dcfce7; color: #14532d; border-color: var(--good); }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text); margin-right: 4px; }
.badge.on { background: #dcfce7; color: #14532d; } .badge.off { background: var(--out-bg); color: #7f1d1d; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 10px; overflow: auto; }
.overlay.show { display: flex; }
.sheet { background: var(--card); color: var(--text); border-radius: 16px; width: 100%; max-width: 680px; padding: 18px; margin: 10px 0; box-shadow: 0 20px 40px rgba(0,0,0,.3); }
.sheet h3 { margin: 0 0 8px; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; justify-content: flex-end; }
.chk { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.chk .q { font-size: .95rem; } .chk button { min-width: 64px; min-height: 40px; border-radius: 8px; border: 2px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; cursor: pointer; }
.chk button.ok.on { background: #16a34a; border-color: #16a34a; color: #fff; } .chk button.df.on { background: #dc2626; border-color: #dc2626; color: #fff; }
.grp { font-weight: 800; margin-top: 14px; color: var(--heading); }
canvas.sig { width: 100%; height: 130px; border: 2px dashed var(--field-border); border-radius: 10px; background: #fff; touch-action: none; display: block; }
table.ev { width: 100%; border-collapse: collapse; font-size: .88rem; } table.ev th, table.ev td { border: 1px solid var(--border); padding: 5px 6px; text-align: left; vertical-align: top; }
.logsheet svg { width: 100%; min-width: 640px; height: auto; display: block; } .logsheet .gw { overflow-x: auto; -webkit-overflow-scrolling: touch; } .logsheet .hdrgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: .9rem; margin-bottom: 8px; }
.err { color: var(--bad); font-weight: 600; margin-top: 6px; min-height: 1em; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; } .seg button { flex: 1; min-width: 90px; padding: 10px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; cursor: pointer; } .seg button.on { background: var(--btn-bg); color: #fff; }
.li { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--card); }
.chip { display: inline-block; font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; margin: 0 4px 6px 0; }
.evrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; background: var(--card); }
.evrow .s { font-weight: 800; } .evrow .ed { font-size: .72rem; color: var(--warn-text); font-weight: 700; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.dot.D { background: #16a34a; } .dot.ON { background: #d97706; } .dot.OFF { background: #64748b; } .dot.SB { background: #2563eb; }
.toast { position: fixed; left: 10px; right: 10px; bottom: 12px; z-index: 1200; max-width: 640px; margin: 0 auto; background: #0f172a; color: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: none; font-size: .95rem; }
.toast.show { display: block; } .toast .tb { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: flex-end; }
.toast button { background: #fff; color: #0f172a; border: 0; border-radius: 8px; padding: 9px 12px; font-weight: 800; cursor: pointer; } .toast button.ghost { background: transparent; color: #cbd5e1; border: 1px solid #475569; }
#map { height: 380px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; z-index: 0; }
.paperwrap { overflow-x: auto; background: #d1d5db; padding: 8px; border-radius: 8px; margin: 8px 0; -webkit-overflow-scrolling: touch; }
.paperwrap .paper { margin: 0 auto 8px; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
/* paper daily log: fixed black-on-white so it prints and emails the same in light or dark theme */
.paper { background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 1.3; width: 760px; padding: 16px 18px; box-sizing: border-box; }
.paper table { border-collapse: collapse; width: 100%; }
.paper td, .paper th { border: 1px solid #000; padding: 2px 5px; vertical-align: top; text-align: left; color: #000; font-size: 11px; }
.paper th { background: #eee; font-size: 10px; }
.paper .lbl { display: block; font-size: 8px; text-transform: uppercase; letter-spacing: .3px; color: #444; }
.paper .v { font-weight: bold; }
.paper .ttl { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px; }
.paper .ttl b { font-size: 17px; letter-spacing: .5px; }
.paper .sec { font-weight: bold; font-size: 10.5px; text-transform: uppercase; margin: 8px 0 3px; letter-spacing: .3px; }
.paper .pt { columns: 2; column-gap: 14px; font-size: 9.5px; }
.paper .pt div { break-inside: avoid; } .paper .pt .g { font-weight: bold; margin-top: 2px; }
.paper .sig { height: 46px; border-bottom: 1px solid #000; }
.paper .ed { font-size: 9px; font-style: italic; }
.paper svg text { font-family: Arial, Helvetica, sans-serif; }
.paper .avoid { break-inside: avoid; page-break-inside: avoid; }
#printArea { display: none; }
@media print {
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; }
  #printArea .paper { width: 100%; box-shadow: none; page-break-after: always; break-after: page; padding: 0; }
  @page { size: letter; margin: 10mm; }
}
</style>
</head>
<body>
<header style="background:#0f172a;color:white;padding:8px 10px;position:sticky;top:0;z-index:100;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;">

<script>
/* ============================== helpers ============================== */
const $ = id => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const SS = { get(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const tms = v => { const t = new Date(v).getTime(); return isNaN(t) ? 0 : t; };
const r2 = n => Math.round(n * 100) / 100;
const fmtH = h => { h = Math.max(0, h); const m = Math.round(h * 60); return Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; };
const fmtHH = h => { const m = Math.round(Math.max(0, h) * 60); return Math.floor(m / 60) + ':' + pad(m % 60); };
const dayStart = key => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const nextDay = key => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d + 1).getTime(); };
const longDate = key => new Date(dayStart(key)).toLocaleDateString('en-CA', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
const STATUS = { OFF: 'Off Duty', SB: 'Sleeper Berth', D: 'Driving', ON: 'On Duty (not driving)' };
const SHORT = { OFF: 'Off Duty', SB: 'Sleeper', D: 'Driving', ON: 'On Duty' };
const ROW = { OFF: 0, SB: 1, D: 2, ON: 3 };
const HEARTBEAT_MS = () => window.__kfHeartbeatMs || 15 * 60000;
const PT_EVERY_MS = () => window.__kfPointMs || 15 * 60000;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// Four rule choices. 0 = not enforced. offCount periods of offHours consecutive hours off in every offDays calendar days.
const RULE_IDS = ['c1', 'c2', 'ab', 'sk'];
const RULE_KEYS = ['maxDriving', 'maxOnDuty', 'maxElapsed', 'resetOffHours', 'cycleHours', 'cycleDays', 'offCount', 'offHours', 'offDays'];
const DEF_RULES = {
  v: 3, defaultSet: 'ab',
  c1: { maxDriving: 13, maxOnDuty: 14, maxElapsed: 16, resetOffHours: 8, cycleHours: 70, cycleDays: 7, offCount: 0, offHours: 24, offDays: 24 },
  c2: { maxDriving: 13, maxOnDuty: 14, maxElapsed: 16, resetOffHours: 8, cycleHours: 120, cycleDays: 14, offCount: 0, offHours: 24, offDays: 24 },
  ab: { maxDriving: 13, maxOnDuty: 15, maxElapsed: 0, resetOffHours: 8, cycleHours: 0, cycleDays: 0, offCount: 1, offHours: 24, offDays: 24 },
  sk: { maxDriving: 13, maxOnDuty: 15, maxElapsed: 0, resetOffHours: 8, cycleHours: 0, cycleDays: 0, offCount: 0, offHours: 24, offDays: 24 },
  autoStatus: 1, stillMinutes: 15, offMinutes: 30, driveKph: 40, stillMeters: 100
};
const SET_NAME = { c1: '70 h / 7 days', c2: '120 h / 14 days', ab: 'Alberta provincial', sk: 'Saskatchewan provincial' };

let URL_ = syncedDriversUrl() || LS.get('kfDrvUrl', '');
let session = LS.get('kfDrvSession', null);     // {name, passcode}
let ctx = LS.get('kfDrvCtx', null);             // cached login payload (company, units, rules, history, unitOdo, lastClose)
let shift = LS.get('kfDrvShift', null);         // the active shift (local first)
let lastPos = LS.get('kfDrvLastPos', null);     // {lat, lon, at, kph, acc}
let online = true, dirty = false, tab = 'drivers', serverV = LS.get('kfDrvServerV', 0);

function syncedDriversUrl() { try { return localStorage.getItem('driversUrl') || ''; } catch (e) { return ''; } }
function saveShiftLocal() { if (shift) LS.set('kfDrvShift', shift); else LS.del('kfDrvShift'); }

async function api(body, timeoutMs) {
  if (!URL_) return { status: 'nourl' };
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), timeoutMs || 25000);
  try {
    const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctl.signal });
    const j = await r.json(); online = true; if (j && j.v) { serverV = j.v; LS.set('kfDrvServerV', j.v); } return j;
  } catch (e) { online = false; return { status: 'offline' }; } finally { clearTimeout(to); }
}
async function getJson(qs) {
  if (!URL_) return null;
  try { const r = await fetch(URL_ + (URL_.includes('?') ? '&' : '?') + qs); const j = await r.json(); if (j && j.v) { serverV = j.v; LS.set('kfDrvServerV', j.v); } return j; } catch (e) { return null; }
}
function mainSettings() { try { return JSON.parse(localStorage.getItem('knightForestrySettings_v3') || '{}'); } catch (e) { return {}; } }
function loadScript(src) { return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) { const t = setInterval(() => { if (src.includes('leaflet') ? window.L : window.html2pdf) { clearInterval(t); res(); } }, 50); setTimeout(() => clearInterval(t), 20000); return; } const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

/* ============================== rules ============================== */
function rulesAll() {
  const src = (ctx && ctx.rules) || (admin && admin.cfg && admin.cfg.rules) || {};
  const r = JSON.parse(JSON.stringify(DEF_RULES));
  ['autoStatus', 'stillMinutes', 'offMinutes', 'driveKph', 'stillMeters'].forEach(k => { if (src[k] != null && src[k] !== '') r[k] = src[k]; });
  if (src.v === 3) {
    if (RULE_IDS.includes(src.defaultSet)) r.defaultSet = src.defaultSet;
    RULE_IDS.forEach(id => { if (src[id]) RULE_KEYS.forEach(k => { if (src[id][k] != null && src[id][k] !== '') r[id][k] = +src[id][k]; }); });
  }
  return r;
}
// Older logs stored a rule set ('ab' / 'fed') plus a cycle ('c1' / 'c2'); map them onto the four choices.
function hosSetOf(sh) {
  const h = sh && sh.hosSet;
  if (RULE_IDS.includes(h)) return h;
  if (h === 'fed') return sh.rule === 'c2' ? 'c2' : 'c1';
  return rulesAll().defaultSet || 'ab';
}
function limitsFor(sh) {
  const r = rulesAll(), id = hosSetOf(sh), set = r[id] || DEF_RULES.ab;
  const cyc = +set.cycleHours > 0 && +set.cycleDays > 0 ? { h: +set.cycleHours, d: +set.cycleDays, name: set.cycleHours + ' h / ' + set.cycleDays + ' days' } : null;
  return Object.assign({ set: id, setName: SET_NAME[id], cyc }, set);
}
function ruleSummary(id, R) { const x = (R || rulesAll())[id]; const parts = [x.maxDriving + ' h driving', x.maxOnDuty + ' h on duty']; if (+x.maxElapsed) parts.push(x.maxElapsed + ' h elapsed'); if (+x.cycleHours) parts.push(x.cycleHours + ' h / ' + x.cycleDays + ' d'); if (+x.offCount) parts.push((+x.offCount > 1 ? x.offCount + '× ' : '') + x.offHours + ' h off per ' + x.offDays + ' d'); return parts.join(' · '); }
function ruleOptions(R) { return RULE_IDS.map(id => `<option value="${id}">${esc(SET_NAME[id])} — ${esc(ruleSummary(id, R))}</option>`).join(''); }
function ruleText(sh) { const l = limitsFor(sh); return l.setName + ': ' + ruleSummary(l.set); }

/* ---- "24 consecutive hours off duty in every 24 calendar days" ---- */
// On-duty blocks come from the office (ctx.onBlocks: every shift of this driver) plus the shifts on this phone.
// Any time not on duty (off duty, sleeper, or between shifts) counts as off. Time before the driver's
// first shift on record is unknown and never counted.
function offStatus(L, nowMs, shifts, useServer) {

function hos(nowMs) {
  const L = limitsFor(shift), segs = segments(shift, nowMs);
  const merged = []; segs.forEach(g => { const off = g.s === 'OFF' || g.s === 'SB'; const last = merged[merged.length - 1]; if (last && last.off === off && last.t1 === g.t0) last.t1 = g.t1; else merged.push({ off, t0: g.t0, t1: g.t1 }); });

    else if (r.status === 'deleted') { alert('The office deleted this shift. It has been removed from this phone.'); shift = null; saveShiftLocal(); LS.del('kfDrvPts'); keepAwake(); renderDrivers(); }

  return { clear() { g.clearRect(0, 0, cv.width, cv.height); dirtyS = false; }, blank() { return !dirtyS; }, data() { const o = document.createElement('canvas'); o.width = 300; o.height = 100; const c = o.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, 300, 100); c.drawImage(cv, 0, 0, 300, 100); return o.toDataURL('image/png'); } };
}

  openSheet(`<h3>Close shift &amp; submit</h3><div class="small">Driving ${fmtH(shift.drivingHrs)} · On duty ${fmtH(shift.onDutyHrs)} · Starting odometer ${esc(shift.startOdo)} km</div>

    <label>Closing remarks — required</label><textarea id="clRem" placeholder="Anything the office should know (delays, issues, vehicle notes). Write 'none' if nothing."></textarea>

      const odo = $('clOdo').value, rem = $('clRem').value.trim();

}

let submitting = false, pdfCache = {};

        const blob = await Promise.race([makePdf(keys, shifts, shift.closedAt ? tms(shift.closedAt) : Date.now()), new Promise((_, rej) => setTimeout(() => rej(new Error('pdf timeout')), 40000))]);

      $('view-drivers').innerHTML = `<div class="card"><h2 style="margin-top:0">Shift submitted</h2><div class="notice good">${esc(summary)}. ${mailed ? 'The log sheet was emailed to the office.' : 'Saved to the office sheet' + (r.emailError ? ' (the email failed: ' + esc(r.emailError) + ')' : ' (no office email is set up yet)') + '.'} You are logged out.</div><button class="btn" id="again" style="width:100%">OK</button></div>`; $('again').onclick = renderDrivers;
    } else if (r && r.status === 'error') {

}

/* ============================== paper daily log ============================== */
// the "Off duty since last shift" entry a new shift starts with
function isLeadOff(sh, e) { return sh.events && sh.events[0] && sh.events[0].id === e.id && e.s === 'OFF' && tms(e.t) < tms(sh.startedAt) - 60000; }
// Everything needed for one calendar day (00:00–24:00), from every shift that touches it.
function buildDay(key, shifts, nowMs, extra) {

    .sort((a, b) => tms(a.startedAt) - tms(b.startedAt));

  if (cur < lim) filled.push({ s: 'OFF', a: cur, b: lim, gap: true });

  const off = offStatus(L, endMs, shifts, sameDriver);
  return {
    key, partial: endMs < d1, lim, segs: filled, tot, events, involved, main, cycUsed: cyc, L, off,
    driverName: main.driverName || (session && session.name) || '', units: uniq(involved.map(s => s.unit)), plates: uniq(involved.map(s => s.plate)), trailers: uniq(involved.flatMap(s => [s.trailerA, s.trailerB])),
    odoStart, odoEnd, distance: odoStart !== '' && odoEnd !== '' ? Math.round(odoEnd - odoStart) : '',

    trips: involved.flatMap(s => (s.trips || []).map(t => Object.assign({ _date: s.date }, t))).filter(t => t._date === key || involved.length === 1),
    fuel: involved.flatMap(s => s.fuel || []).filter(f => !f.at || (tms(f.at) >= d0 && tms(f.at) < d1)),
    closed: involved.filter(s => s.closedAt && tms(s.closedAt) >= d0 && tms(s.closedAt) < d1),
    gaps: involved.flatMap(s => s.gpsGaps || []).filter(g => tms(g.to) >= d0 && tms(g.from) < d1),
    company: (extra && extra.company) || (ctx && ctx.company) || (admin.cfg && admin.cfg.company) || {},
    licence: (extra && extra.licence) || (ctx && ctx.driver && ctx.driver.licenseNo) || ''

}
function paperGrid(day) {

  s += `<rect x="${L}" y="${T}" width="${plot}" height="${rowH * 4}" fill="#fff" stroke="#000" stroke-width="1.2"/>`;
  for (let h = 0; h <= 24; h++) {
    const xx = x(h * 60); s += `<line x1="${xx}" y1="${T}" x2="${xx}" y2="${T + rowH * 4}" stroke="#000" stroke-width="${h % 6 === 0 ? 1 : .6}"/>`;
    const lab = h === 0 || h === 24 ? 'Mid' : h === 12 ? 'Noon' : String(h);
    s += `<text x="${xx}" y="${T - 7}" font-size="${h === 0 || h === 12 || h === 24 ? 8 : 9.5}" text-anchor="middle" fill="#000" font-weight="bold">${lab}</text>`;
    if (h < 24) for (let q = 1; q < 4; q++) { const qx = x(h * 60 + q * 15), len = q === 2 ? 9 : 5; for (let r = 0; r < 4; r++) s += `<line x1="${qx}" y1="${T + r * rowH}" x2="${qx}" y2="${T + r * rowH + len}" stroke="#000" stroke-width=".5"/>`; }
  }
  ['1. Off Duty', '2. Sleeper Berth', '3. Driving', '4. On Duty (not driving)'].forEach((n, i) => {
    s += `<line x1="${L}" y1="${T + (i + 1) * rowH}" x2="${L + plot}" y2="${T + (i + 1) * rowH}" stroke="#000" stroke-width="1"/>`;
    const parts = i === 3 ? ['4. On Duty', '(not driving)'] : [n];
    parts.forEach((p, j) => { s += `<text x="4" y="${y(i) + (parts.length > 1 ? (j === 0 ? -2 : 8) : 3.5)}" font-size="${j ? 8 : 10}" fill="#000" font-weight="${j ? 'normal' : 'bold'}">${p}</text>`; });

}
function remarksBand(day) {

  const flags = day.events.map((e, i) => ({ n: i + 1, m: (tms(e.t) - d0) / 60000 }));
  const H = 30; let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block"><line x1="${L}" y1="1" x2="${L + plot}" y2="1" stroke="#000" stroke-width=".6"/><text x="4" y="12" font-size="10" font-weight="bold" fill="#000">REMARKS</text><text x="4" y="23" font-size="7.5" fill="#000">see numbered list</text>`;

    if (map) {
      if (pts.length > 1) L.polyline(pts.map(p => [p.lat, p.lon]), { color: '#2563eb', weight: 3, opacity: .7 }).addTo(map);
      pts.forEach(p => { L.circleMarker([p.lat, p.lon], { radius: 4, color: STATUS_COLOR[p.status] || '#2563eb', fillOpacity: 1 }).addTo(map).bindTooltip(`${hm(new Date(p.at))} · ${SHORT[p.status] || ''}${p.kph != null ? ' · ' + p.kph + ' km/h' : ''}`); bounds.push([p.lat, p.lon]); });
      evs.forEach((e, i) => { if (e.lat == null || isNaN(+e.lat)) return; L.marker([+e.lat, +e.lon], { icon: L.divIcon({ className: '', html: `<div style="background:${STATUS_COLOR[e.s]};color:#fff;border:2px solid #0f172a;border-radius:50%;width:22px;height:22px;line-height:18px;text-align:center;font-weight:800;font-size:12px">${i + 1}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map).bindPopup(`<b>${i + 1}. ${esc(e.hm)} ${esc(SHORT[e.s])}</b><br>${esc(e.place || '')}<br>${esc(e.note || '')}`); bounds.push([+e.lat, +e.lon]); });
    }
    info.innerHTML = `<h4 style="margin:6px 0">Duty status changes — ${esc(r.driver.name)} · ${esc(longDate(admin.mapDate))}</h4>` + (evs.length ? `<table class="ev"><tr><th>#</th><th>Time</th><th>Status</th><th>Location</th><th>Note</th></tr>${evs.map((e, i) => `<tr><td>${i + 1}</td><td>${esc(e.hm)}</td><td><span class="dot ${e.s}"></span>${esc(SHORT[e.s])}</td><td>${esc(e.place || '')}${e.lat != null ? ` <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${+e.lat},${+e.lon}">map</a>` : ''}</td><td>${esc(e.note || '')}${e.edited ? ' <i>(edited: ' + esc(e.editReason || '') + ')</i>' : ''}</td></tr>`).join('')}</table>` : '<div class="small">No duty status changes this day.</div>')
      + (gaps.length ? `<div class="notice" style="margin-top:8px">GPS not recorded (app closed): ${gaps.map(g => esc(hm(new Date(g.from))) + '–' + esc(hm(new Date(g.to)))).join(', ')}</div>` : '')
      + `<details style="margin-top:8px"><summary><b>15-minute positions (${pts.length})</b></summary><table class="ev"><tr><th>Time</th><th>Status</th><th>Speed</th><th>Position</th></tr>${pts.map(p => `<tr><td>${esc(hm(new Date(p.at)))}</td><td>${esc(SHORT[p.status] || p.status || '')}</td><td>${p.kph != null ? esc(p.kph) + ' km/h' : ''}</td><td><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${p.lat},${p.lon}">${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</a></td></tr>`).join('')}</table></details>`;
  }
  if (map && bounds.length) { if (bounds.length === 1) map.setView(bounds[0], 11, { animate: false }); else map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13, animate: false }); }
  if (map) setTimeout(() => { if (mapObj === map) { try { map.invalidateSize(); } catch (e) {} } }, 200);
}

function renderUnits(body) {
  const units = admin.cfg.units;
  body.innerHTML = `<div id="unList">${units.map((u, i) => `<div class="li"><div class="row2"><div><label>Unit name</label><input data-i="${i}" data-f="name" value="${esc(u.name)}"></div><div><label>Truck plate</label><input data-i="${i}" data-f="plate" value="${esc(u.plate)}"></div></div><div class="row2"><div><label>Trailer plate A</label><input data-i="${i}" data-f="trailerA" value="${esc(u.trailerA)}"></div><div><label>Trailer plate B</label><input data-i="${i}" data-f="trailerB" value="${esc(u.trailerB)}"></div></div><button class="btn btn-sm btn-outline" data-del="${i}" style="margin-top:6px">Remove unit</button></div>`).join('') || '<div class="small">No units yet.</div>'}</div>
    <div class="btnrow" style="justify-content:flex-start"><button class="btn btn-outline" id="unAdd">Add unit</button><button class="btn" id="unSave">Save units</button></div><div class="err" id="unMsg"></div>`;
  body.querySelectorAll('[data-f]').forEach(inp => inp.oninput = () => { units[+inp.dataset.i][inp.dataset.f] = inp.value; });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Remove this unit?')) { units.splice(+b.dataset.del, 1); renderUnits(body); } });
  $('unAdd').onclick = () => { units.push({ id: '', name: '', plate: '', trailerA: '', trailerB: '' }); renderUnits(body); };
  $('unSave').onclick = async () => { const clean = units.filter(u => u.name.trim()); const r = await adminApi('adminSaveConfig', { config: { units: clean } }); $('unMsg').textContent = r.status === 'ok' ? 'Saved.' : (r.message || 'Could not save.'); if (r.status === 'ok') { admin.cfg = r.config; $('unMsg').style.color = 'var(--good)'; } else $('unMsg').style.color = 'var(--bad)'; };
}

function renderSettings() {
  const v = $('view-settings');
  adminGate(v, 'Settings log in', async () => {
    const r = await loadCfg(); if (r.status !== 'ok') { v.innerHTML = '<div class="card"><div class="notice bad">Could not load settings.</div></div>'; return; }
    const c = admin.cfg.company, ru = rulesAll(); const sv = r.v || serverV || 1;
    const lim = (set, k) => `<input id="ru_${set}_${k}" type="number" min="0" step="0.5" value="${esc(ru[set][k])}" style="min-width:60px;padding:8px">`;
    const ROWS = [['maxDriving', 'Max driving (h)'], ['maxOnDuty', 'Max on duty (h)'], ['maxElapsed', 'Max elapsed (h, 0 = none)'], ['resetOffHours', 'Off-duty rest that resets (h)'], ['cycleHours', 'Cycle hours (0 = none)'], ['cycleDays', 'Cycle days'], ['offCount', 'Periods of consecutive hours off required (0 = none)'], ['offHours', '…each this many hours'], ['offDays', '…in every this many calendar days']];
    v.innerHTML = `${sv < 3 ? needV2('This version of the Drivers page') : ''}<div class="card"><h3 style="margin-top:0">Company information</h3>
      ${/svc=drivers/.test(URL_) ? '<div class="small">Company name, address and phone come from Billing → Settings (company info). Set the office email here.</div>' : ''}<label>Company name</label><input id="coName" value="${esc(c.name)}"><label>Address (printed on the log as principal place of business)</label><input id="coAddr" value="${esc(c.address)}"><div class="row2"><div><label>Phone</label><input id="coPhone" value="${esc(c.phone)}"></div><div><label>Office email (logs are sent here)</label><input id="coMail" type="email" value="${esc(c.officeEmail)}"></div></div>
      <h3>Hours of service</h3><label>Default rules for new shifts</label><select id="ruDef">${RULE_IDS.map(id => `<option value="${id}">${esc(SET_NAME[id])}</option>`).join('')}</select>
      <div style="overflow-x:auto"><table class="ev" style="margin-top:8px"><tr><th></th>${RULE_IDS.map(id => `<th>${esc(SET_NAME[id])}</th>`).join('')}</tr>
        ${ROWS.map(rw => `<tr><td>${rw[1]}</td>${RULE_IDS.map(id => `<td>${lim(id, rw[0])}</td>`).join('')}</tr>`).join('')}</table></div>
      <h3>Automatic duty status from GPS</h3><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="ruAuto" style="width:24px;min-height:24px;margin:0" ${+ru.autoStatus !== 0 ? 'checked' : ''}> Change duty status automatically</label>
      <div class="row2"><div><label>Moving faster than (km/h) → Driving</label><input id="ruKph" type="number" value="${esc(ru.driveKph)}"></div><div><label>Stopped (min) → On Duty</label><input id="ruSM" type="number" value="${esc(ru.stillMinutes)}"></div>
      <div><label>Stopped (min) → Off Duty</label><input id="ruOM" type="number" value="${esc(ru.offMinutes)}"></div><div><label>"Stopped" means within (m)</label><input id="ruSD" type="number" value="${esc(ru.stillMeters)}"></div></div>
      <div class="btnrow" style="justify-content:flex-start"><button class="btn" id="coSave">Save company &amp; rules</button></div><div class="err" id="coMsg"></div></div>
    <div class="card"><h3 style="margin-top:0">Drivers</h3><div id="drvList"></div><div class="btnrow" style="justify-content:flex-start"><button class="btn" id="drvNew">Add driver</button></div></div>
    <div class="card"><h3 style="margin-top:0">This phone</h3><label>Drivers script link</label><input id="urlSet" value="${esc(URL_)}"><div class="small">Company Sync (Quote page) shares this link with every device.</div><div class="btnrow" style="justify-content:flex-start"><button class="btn btn-outline" id="urlUpd">Update link</button><button class="btn btn-outline" id="plTest">Test village names</button>${/svc=drivers/.test(URL_) ? '' : '<button class="btn btn-outline" id="pwChg">Change admin password</button>'}</div><div class="err" id="stMsg"></div><div class="small">Drivers script version: ${esc(sv)}</div></div>`;
    $('ruDef').value = RULE_IDS.includes(ru.defaultSet) ? ru.defaultSet : 'ab';
    $('coSave').onclick = async () => {
      const n = id => +$(id).value; const set = s => { const o = {}; RULE_KEYS.forEach(k => { o[k] = n(`ru_${s}_${k}`); }); return o; };
      const r = await adminApi('adminSaveConfig', { config: { company: { name: $('coName').value, address: $('coAddr').value, phone: $('coPhone').value, officeEmail: $('coMail').value }, rules: { v: 3, defaultSet: $('ruDef').value, c1: set('c1'), c2: set('c2'), ab: set('ab'), sk: set('sk'), autoStatus: $('ruAuto').checked ? 1 : 0, driveKph: n('ruKph'), stillMinutes: n('ruSM'), offMinutes: n('ruOM'), stillMeters: n('ruSD') } } });
      $('coMsg').textContent = r.status === 'ok' ? 'Saved. Drivers get the new rules the next time they log in.' : (r.message || 'Could not save.'); $('coMsg').style.color = r.status === 'ok' ? 'var(--good)' : 'var(--bad)'; if (r.status === 'ok') admin.cfg = r.config;
    };
    const drawDrivers = () => {
      $('drvList').innerHTML = admin.drivers.map(d => `<button class="act" data-id="${esc(d.id)}"><span>${esc(d.name)}<br><span class="small">${d.phone ? esc(d.phone) + ' · ' : ''}${d.licenseNo ? 'Licence ' + esc(d.licenseNo) : 'no licence # yet'}${d.licenseExpiry ? ' · exp ' + esc(d.licenseExpiry) : ''}</span></span><span class="tag ${d.active ? 'ok' : 'bad'}">${d.active ? 'Active' : 'Inactive'}</span></button>`).join('') || '<div class="small">No drivers yet.</div>';
      $('drvList').querySelectorAll('[data-id]').forEach(b => b.onclick = () => driverForm(admin.drivers.find(x => String(x.id) === b.dataset.id)));
    };
    drawDrivers(); $('drvNew').onclick = () => driverForm(null);
    function driverForm(d) {
      d = d || { name: '', active: true, phone: '', licenseNo: '', licenseExpiry: '', licenseLink: '', expenseNotes: '' };
      openSheet(`<h3>${d.id ? 'Edit driver' : 'Add driver'}</h3><label>Driver name</label><input id="dfName" value="${esc(d.name)}"><label>Phone number</label><input id="dfPhone" type="tel" inputmode="tel" value="${esc(d.phone || '')}" placeholder="780-555-1234"><label>${d.id ? 'New passcode (leave blank to keep)' : 'Create passcode'}</label><input id="dfPass" type="text" autocomplete="off" placeholder="at least 4 characters">
        <div class="row2"><div><label>Licence number</label><input id="dfLic" value="${esc(d.licenseNo)}"></div><div><label>Licence expiry</label><input id="dfExp" type="date" value="${esc(d.licenseExpiry)}"></div></div>
        <label>Licence photo link (Drive link)</label><input id="dfLink" value="${esc(d.licenseLink)}" placeholder="https://drive.google.com/…"><div class="small">Photo upload straight from the phone comes in the next release; paste a Drive link for now.</div>
        <label>Expense notes</label><textarea id="dfNotes">${esc(d.expenseNotes)}</textarea><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="dfAct" style="width:24px;min-height:24px;margin:0" ${d.active !== false ? 'checked' : ''}> Active (can log in)</label>
        <div class="err" id="dfErr"></div><div class="btnrow"><button class="btn btn-outline" id="dfNo">Cancel</button><button class="btn" id="dfOk">Save driver</button></div>`, () => {
        $('dfNo').onclick = closeSheet;
        $('dfOk').onclick = async () => {
          const r = await adminApi('adminSaveDriver', { driver: { id: d.id, name: $('dfName').value, phone: $('dfPhone').value.trim(), passcode: $('dfPass').value, licenseNo: $('dfLic').value, licenseExpiry: $('dfExp').value, licenseLink: $('dfLink').value, expenseNotes: $('dfNotes').value, active: $('dfAct').checked } });
          if (r.status === 'ok') { admin.drivers = r.drivers; closeSheet(); drawDrivers(); } else $('dfErr').textContent = r.message || 'Could not save.';
        };
      });
    }
    $('urlUpd').onclick = () => { const u = $('urlSet').value.trim(); if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u)) { $('stMsg').textContent = 'That is not a script link.'; return; } URL_ = u; LS.set('kfDrvUrl', u); kfLinks.set('driversUrl', u); $('stMsg').textContent = 'Saved on this phone. Quote → Settings → Save to Company shares it with every device.'; $('stMsg').style.color = 'var(--good)'; };
    $('plTest').onclick = async () => {
      $('stMsg').style.color = ''; $('stMsg').textContent = 'Getting GPS…'; const p = await getPosition();
      if (!p) { $('stMsg').textContent = 'No GPS position. Allow location for this site.'; return; }
      const cache = LS.get('kfDrvPlaces', {}); delete cache[p.lat.toFixed(2) + ',' + p.lon.toFixed(2)]; LS.set('kfDrvPlaces', cache);
      const name = await placeFor(p.lat, p.lon);
      $('stMsg').innerHTML = `<b>${esc(name)}</b><br>Source: ${esc(placeInfo.source)}${placeInfo.error ? '<br>Problem: ' + esc(placeInfo.error) : ''}`;
    };
    if ($('pwChg')) $('pwChg').onclick = () => openSheet(`<h3>Change admin password</h3><label>Current password</label><input id="pcOld" type="password"><label>New password</label><input id="pcNew" type="password"><label>Confirm new password</label><input id="pcNew2" type="password"><div class="err" id="pcErr"></div><div class="btnrow"><button class="btn btn-outline" id="pcNo">Cancel</button><button class="btn" id="pcOk">Change</button></div>`, () => {
      $('pcNo').onclick = closeSheet; $('pcOk').onclick = async () => { if ($('pcNew').value !== $('pcNew2').value) { $('pcErr').textContent = 'New passwords do not match.'; return; } const r = await api({ action: 'adminSetPassword', password: $('pcOld').value, newPassword: $('pcNew').value }); if (r.status === 'ok') { SS.set('kfDrvAdmin', $('pcNew').value); closeSheet(); $('stMsg').textContent = 'Admin password changed.'; } else $('pcErr').textContent = r.status === 'badpassword' ? 'Current password is wrong.' : (r.message || 'Could not change.'); };
    });
  });
}

/* ---------- phone back button (nav.js): pop-up → Drivers tab → Quote home ---------- */
window.kfBack = function () {
  if ($('sheetOv').classList.contains('show')) { if (!$('sheetOv').dataset.lock) closeSheet(); return true; }
  if ($('toast').classList.contains('show')) { hideToast(); return true; }
  if (tab !== 'drivers') { showTab('drivers'); return true; }
  return false;
};

/* ============================== boot ============================== */
(function boot() {
  if (shift) normalize(shift);
  const h = (location.hash || '').replace('#', ''); tab = ['admin', 'settings'].includes(h) ? h : 'drivers';
  showTab(tab);
  if (shift && session && !shift.submittedPending) { pushShift(); keepAwake(); }
  if (session && URL_ && navigator.onLine !== false) api({ action: 'driverLogin', name: session.name, passcode: session.passcode }).then(r => { if (r.status === 'ok') { const os = r.openShift; setCtx(r); if (!shift && os) { shift = normalize(os); saveShiftLocal(); } if (tab === 'drivers' && !$('sheetOv').classList.contains('show')) renderDrivers(); } });
  const n = $('companyNameBanner'); const s = mainSettings(); if (n && s.companyName) n.textContent = s.companyName;
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
