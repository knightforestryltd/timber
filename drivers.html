<style>
.container { max-width: 720px; margin: 0 auto; padding: 12px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
.small { font-size: .82rem; color: var(--muted); }
label { display: block; margin: 10px 0 4px; font-size: .9rem; }
input, select, textarea { width: 100%; padding: 12px; min-height: 46px; margin-bottom: 4px; font-size: 16px; }
textarea { min-height: 80px; }
.hidden { display: none !important; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.tabs button { padding: 12px 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; font-size: 1rem; cursor: pointer; }
.tabs button.on { background: var(--btn-bg); color: #fff; border-color: var(--btn-bg); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 2px solid var(--primary-light); background: var(--card); }
.stat .big { font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
.stat .sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.stat.D { border-color: var(--good); } .stat.ON { border-color: var(--amber); } .stat.OFF, .stat.SB { border-color: var(--primary-light); }
.sbtn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

.sbtn small { display: block; font-weight: 500; font-size: .75rem; color: var(--muted); }

.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.meter { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }

.bar { height: 8px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--good); }
.meter.warn .bar > i { background: var(--amber); } .meter.over .bar > i { background: var(--bad); } .meter.over .val { color: var(--bad); }
.act { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; padding: 14px 16px; min-height: 56px; margin-bottom: 8px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }

.act .tag.ok { background: #dcfce7; color: #14532d; } .act .tag.bad { background: var(--out-bg); color: #7f1d1d; } .act .tag.todo { background: var(--warn-bg); color: var(--warn-text); }
.notice { padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); font-size: .92rem; }
.notice.bad { background: var(--out-bg); color: #7f1d1d; border-color: var(--bad); } .notice.good { background: #dcfce7; color: #14532d; border-color: var(--good); }

.badge.on { background: #dcfce7; color: #14532d; } .badge.off { background: var(--out-bg); color: #7f1d1d; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 10px; overflow: auto; }
.overlay.show { display: flex; }
.sheet { background: var(--card); color: var(--text); border-radius: 16px; width: 100%; max-width: 680px; padding: 18px; margin: 10px 0; box-shadow: 0 20px 40px rgba(0,0,0,.3); }
.sheet h3 { margin: 0 0 8px; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; justify-content: flex-end; }
.chk { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.chk .q { font-size: .95rem; } .chk button { min-width: 64px; min-height: 40px; border-radius: 8px; border: 2px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; cursor: pointer; }
.chk button.ok.on { background: #16a34a; border-color: #16a34a; color: #fff; } .chk button.df.on { background: #dc2626; border-color: #dc2626; color: #fff; }
.grp { font-weight: 800; margin-top: 14px; color: var(--heading); }
canvas.sig { width: 100%; height: 130px; border: 2px dashed var(--field-border); border-radius: 10px; background: #fff; touch-action: none; display: block; }
table.ev { width: 100%; border-collapse: collapse; font-size: .88rem; } table.ev th, table.ev td { border: 1px solid var(--border); padding: 5px 6px; text-align: left; vertical-align: top; }
.logsheet svg { width: 100%; min-width: 640px; height: auto; display: block; } .logsheet .gw { overflow-x: auto; -webkit-overflow-scrolling: touch; } .logsheet .hdrgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: .9rem; margin-bottom: 8px; }
.err { color: var(--bad); font-weight: 600; margin-top: 6px; min-height: 1em; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; } .seg button { flex: 1; min-width: 90px; padding: 10px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; cursor: pointer; } .seg button.on { background: var(--btn-bg); color: #fff; }
.li { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--card); }
@media print { header, .tabs, .btnrow, .noprint { display: none !important; } .overlay { position: static; background: none; display: block; } .sheet { box-shadow: none; } }
</style>

<script>
/* ============================== helpers ============================== */
const $ = id => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const SS = { get(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const r2 = n => Math.round(n * 100) / 100;
const fmtH = h => { h = Math.max(0, h); const m = Math.round(h * 60); return Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; };
const STATUS = { OFF: 'Off Duty', SB: 'Sleeper', D: 'Driving', ON: 'On Duty' };
const ROW = { OFF: 0, SB: 1, D: 2, ON: 3 };
const HEARTBEAT_MS = () => window.__kfHeartbeatMs || 15 * 60000;

let URL_ = LS.get('kfDrvUrl', '');
let session = LS.get('kfDrvSession', null);     // {name, passcode}
let ctx = LS.get('kfDrvCtx', null);             // cached login payload (company, units, rules, history, unitOdo)
let shift = LS.get('kfDrvShift', null);         // the active shift (local first)
let lastPos = LS.get('kfDrvLastPos', null);     // {lat, lon, at}
let online = true, dirty = false, tab = 'drivers';

function saveShiftLocal() { if (shift) LS.set('kfDrvShift', shift); else LS.del('kfDrvShift'); }

async function api(body, timeoutMs) {
  if (!URL_) return { status: 'nourl' };
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), timeoutMs || 20000);
  try {
    const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctl.signal });
    const j = await r.json(); online = true; return j;
  } catch (e) { online = false; return { status: 'offline' }; } finally { clearTimeout(to); }
}
async function getJson(qs) {
  if (!URL_) return null;
  try { const r = await fetch(URL_ + (URL_.includes('?') ? '&' : '?') + qs); return await r.json(); } catch (e) { return null; }
}
function mainSettings() { try { return JSON.parse(localStorage.getItem('knightForestrySettings_v3') || '{}'); } catch (e) { return {}; } }

/* ============================== sheet (pop-up) ============================== */
function openSheet(html, mount) { $('sheetBox').innerHTML = html; $('sheetOv').classList.add('show'); if (mount) mount($('sheetBox')); $('sheetOv').scrollTop = 0; }
function closeSheet() { $('sheetOv').classList.remove('show'); $('sheetBox').innerHTML = ''; }
$('sheetOv').addEventListener('mousedown', e => { if (e.target === $('sheetOv') && !$('sheetOv').dataset.lock) closeSheet(); });

/* ============================== GPS + place names ============================== */
const TOWNS = [['Drayton Valley',53.223,-114.977],['Edmonton',53.546,-113.491],['Calgary',51.045,-114.057],['Red Deer',52.268,-113.811],['Rocky Mountain House',52.376,-114.919],['Sundre',51.797,-114.633],['Olds',51.792,-114.106],['Hinton',53.401,-117.585],['Edson',53.581,-116.436],['Whitecourt',54.143,-115.686],['Fox Creek',54.401,-116.809],['Grande Prairie',55.171,-118.795],['Lloydminster',53.278,-110.006],['Wetaskiwin',52.969,-113.377],['Camrose',53.017,-112.833],['Leduc',53.259,-113.549],['Stony Plain',53.527,-114.007],['Spruce Grove',53.545,-113.9],['Fort Saskatchewan',53.713,-113.213],['Drumheller',51.463,-112.709],['Lacombe',52.468,-113.737],['Stettler',52.322,-112.719],['Fort McMurray',56.727,-111.381],['Peace River',56.234,-117.289],['High Prairie',55.436,-116.486],['Slave Lake',55.28,-114.769],['Athabasca',54.72,-113.286],['Lac La Biche',54.77,-111.97],['Cold Lake',54.464,-110.182],['Vegreville',53.495,-112.05],['Vermilion',53.356,-110.858],['Wainwright',52.833,-110.856],['Hanna',51.638,-111.902],['Brooks',50.564,-111.899],['Medicine Hat',50.04,-110.677],['Lethbridge',49.694,-112.833],['Pincher Creek',49.486,-113.951],['Cochrane',51.189,-114.467],['Canmore',51.089,-115.359],['Banff',51.178,-115.571],['Jasper',52.873,-118.08],['Valleyview',55.07,-117.285],['Barrhead',54.122,-114.402],['Mayerthorpe',53.95,-115.133],['Evansburg',53.593,-115.071],['Rimbey',52.636,-114.227],['Ponoka',52.677,-113.584],['Bonnyville',54.267,-110.741],['St. Paul',53.99,-111.29],['Westlock',54.15,-113.863],['Swan Hills',54.716,-115.4],['Eckville',52.36,-114.36],['Breton',53.1,-114.47],['Rocky Rapids',53.14,-115.05],['Warburg',53.18,-114.29],['Saskatoon',52.134,-106.67],['Regina',50.445,-104.619],['North Battleford',52.78,-108.29]];
function hav(a, b, c, d) { const R = 6371000, t = x => x * Math.PI / 180; const dLa = t(c - a), dLo = t(d - b); const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function bearingWord(a, b, c, d) { const t = x => x * Math.PI / 180; const y = Math.sin(t(d - b)) * Math.cos(t(c)); const x = Math.cos(t(a)) * Math.sin(t(c)) - Math.sin(t(a)) * Math.cos(t(c)) * Math.cos(t(d - b)); const deg = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(deg / 45) % 8]; }
function nearestTown(lat, lon) {
  let best = null, bd = 1e12;
  TOWNS.forEach(t => { const d = hav(lat, lon, t[1], t[2]); if (d < bd) { bd = d; best = t; } });
  if (!best) return lat.toFixed(4) + ', ' + lon.toFixed(4);
  const km = Math.round(bd / 1000);
  return km < 8 ? 'near ' + best[0] : km + ' km ' + bearingWord(best[1], best[2], lat, lon) + ' of ' + best[0];
}
async function placeFor(lat, lon) {
  const key = mainSettings().apiKey;
  if (key && navigator.onLine !== false) {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch('https://maps.googleapis.com/maps/api/geocode/json?latlng=' + lat + ',' + lon + '&result_type=locality|sublocality|administrative_area_level_3&key=' + encodeURIComponent(key), { signal: ctl.signal });
      clearTimeout(to); const j = await r.json();
      const res = j && j.results && j.results[0];
      if (res) { const comp = (res.address_components || []).find(c => (c.types || []).includes('locality')) || (res.address_components || [])[0]; if (comp && comp.long_name) return 'near ' + comp.long_name; }
    } catch (e) {}
  }
  return nearestTown(lat, lon);
}
function getPosition() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(lastPos);
    navigator.geolocation.getCurrentPosition(p => { const o = { lat: p.coords.latitude, lon: p.coords.longitude, at: new Date().toISOString() }; lastPos = o; LS.set('kfDrvLastPos', o); resolve(o); }, () => resolve(lastPos), { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
  });
}
let watchId = null, anchor = null, stillShown = false;
function startWatch() {
  if (watchId != null || !navigator.geolocation) return;
  try {
    watchId = navigator.geolocation.watchPosition(p => {
      lastPos = { lat: p.coords.latitude, lon: p.coords.longitude, at: new Date().toISOString() }; LS.set('kfDrvLastPos', lastPos); gpsBadge(true); checkStill();
    }, () => gpsBadge(false), { enableHighAccuracy: true, maximumAge: 20000, timeout: 30000 });
  } catch (e) {}
}
function stopWatch() { if (watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(watchId); watchId = null; anchor = null; }
function gpsBadge(ok) { const b = $('gpsBadge'); if (b) { b.className = 'badge ' + (ok ? 'on' : 'off'); b.textContent = ok ? 'GPS on' : 'GPS off'; } }

function checkStill() {
  if (!shift || shift.submittedPending || !lastPos || curStatus() !== 'D' || stillShown) { if (curStatus() !== 'D') anchor = null; return; }
  const rules = (ctx && ctx.rules) || {};
  const meters = rules.stillMeters || 100, mins = rules.stillMinutes || 15;
  const now = Date.now();
  if (!anchor || hav(anchor.lat, anchor.lon, lastPos.lat, lastPos.lon) > meters) { anchor = { lat: lastPos.lat, lon: lastPos.lon, at: now }; return; }
  if (now - anchor.at >= mins * 60000) showStill(mins, meters);
}
function showStill(mins, meters) {
  stillShown = true; $('sheetOv').dataset.lock = '1';
  openSheet(`<h3>Still driving?</h3><p>This phone has stayed within ${meters} m for ${mins} minutes while you are logged as <b>Driving</b>. Change your duty status?</p>
    <div class="sbtn-grid"><button class="sbtn" data-s="ON">On Duty<small>not driving</small></button><button class="sbtn" data-s="OFF">Off Duty</button><button class="sbtn" data-s="SB">Sleeper</button><button class="sbtn cur" data-s="D">Still driving<small>keep Driving</small></button></div>`, box => {
    box.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
      const s = b.dataset.s; delete $('sheetOv').dataset.lock; stillShown = false; anchor = lastPos ? { lat: lastPos.lat, lon: lastPos.lon, at: Date.now() } : null; closeSheet();
      if (s !== 'D') changeStatus(s);
    });
  });
}

/* ============================== shift model + hours ============================== */
function curStatus() { if (!shift || !shift.events.length) return 'OFF'; return shift.events[shift.events.length - 1].s; }
function segments(sh, nowMs) {
  const ev = (sh.events || []).slice().sort((a, b) => new Date(a.t) - new Date(b.t)), out = [];
  for (let i = 0; i < ev.length; i++) {
    let s = new Date(ev[i].t).getTime(), e = i + 1 < ev.length ? new Date(ev[i + 1].t).getTime() : nowMs;
    if (e <= s) continue;
    let cur = s;
    while (cur < e) {
      const d = new Date(cur), mid = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime(), end = Math.min(e, mid);
      const day0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      out.push({ day: dkey(d), s: ev[i].s, a: (cur - day0) / 60000, b: (end - day0) / 60000, ms: end - cur });
      cur = end;
    }
  }
  return out;
}
function dayTotals(segs) {
  const m = {};
  segs.forEach(g => { const o = m[g.day] = m[g.day] || { OFF: 0, SB: 0, D: 0, ON: 0 }; o[g.s] += g.ms / 3600000; });
  return m;
}
function stamp(sh, nowMs) {
  const t = dayTotals(segments(sh, nowMs)); let d = 0, on = 0; const days = [];
  Object.keys(t).sort().forEach(k => { d += t[k].D; on += t[k].D + t[k].ON; days.push({ date: k, onDuty: r2(t[k].D + t[k].ON), driving: r2(t[k].D) }); });
  sh.drivingHrs = r2(d); sh.onDutyHrs = r2(on); sh.days = days; return t;
}
function hos(nowMs) {

  const evs = shift.events.slice().sort((a, b) => new Date(a.t) - new Date(b.t));
  evs.forEach((e, i) => { if (e.s !== 'OFF' && e.s !== 'SB') return; const a = new Date(e.t).getTime(), b = i + 1 < evs.length ? new Date(evs[i + 1].t).getTime() : nowMs; if (b - a >= rules.resetOffHours * 3600000) wStart = Math.max(wStart, b); });

}

function makeSig(cv, existing) {

  openSheet(`<h3>Close shift &amp; submit</h3><div class="small">Driving ${fmtH(shift.drivingHrs)} · On duty ${fmtH(shift.onDutyHrs)} · Starting odometer ${esc(shift.startOdo)} km</div>
    <label>Ending odometer (km) — required</label><input id="clOdo" type="number" inputmode="decimal">
    <label>Closing remarks — required</label><textarea id="clRem" placeholder="Anything the office should know (delays, issues, vehicle notes). Write 'none' if nothing."></textarea>
    <label>Driver signature — required</label><canvas class="sig" id="clSig"></canvas><div class="btnrow" style="justify-content:flex-start;margin-top:4px"><button class="btn btn-sm btn-outline" id="clClr">Clear signature</button></div>
    <div class="small" style="margin-top:8px">I certify this log is true and correct. Submitting sets you Off Duty, emails the office and logs you out.</div>

      if (+odo < +shift.startOdo) { $('clErr').textContent = 'Ending odometer is lower than the starting odometer (' + shift.startOdo + ').'; return; }
      if (!rem) { $('clErr').textContent = 'Enter closing remarks (write "none" if nothing).'; return; }
      if (sig.blank()) { $('clErr').textContent = 'Sign the log.'; return; }
      $('clGo').disabled = true; $('clErr').textContent = 'Submitting…';
      const pos = await getPosition(); const place = pos ? await placeFor(pos.lat, pos.lon) : '';
      const now = new Date();
      if (curStatus() !== 'OFF') shift.events.push({ t: now.toISOString(), hm: hm(now), s: 'OFF', label: 'Off Duty (shift closed)', lat: pos ? pos.lat : null, lon: pos ? pos.lon : null, place, note: '' });
      shift.endOdo = +odo; shift.remarks = rem; shift.signature = sig.data(); shift.closedAt = now.toISOString(); stamp(shift, now.getTime());

}
let submitting = false;
async function submitNow() {

      const summary = `Driving ${fmtH(shift.drivingHrs)} · On duty ${fmtH(shift.onDutyHrs)}`; const mailed = r.emailed;

      $('view-drivers').innerHTML = `<div class="card"><h2 style="margin-top:0">Shift submitted</h2><div class="notice good">${esc(summary)}. ${mailed ? 'The log was emailed to the office.' : 'Saved to the office sheet (no office email is set up yet).'} You are logged out.</div><button class="btn" id="again" style="width:100%">OK</button></div>`; $('again').onclick = renderDrivers;

/* ============================== log sheet rendering ============================== */
function gridSvg(day, segs) {
  const W = 960, L = 74, R = 12, H = 150, T = 18, rowH = 30, plot = W - L - R;
  const x = m => L + m / 1440 * plot, y = r => T + r * rowH + rowH / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Duty status graph for ${esc(day)}"><rect x="${L}" y="${T}" width="${plot}" height="${rowH * 4}" fill="none" stroke="currentColor" opacity=".5"/>`;
  for (let h = 0; h <= 24; h++) { const xx = x(h * 60); s += `<line x1="${xx}" y1="${T}" x2="${xx}" y2="${T + rowH * 4}" stroke="currentColor" opacity="${h % 6 === 0 ? .5 : .18}"/>`; if (h % 2 === 0 || h === 24) s += `<text x="${xx}" y="12" font-size="14" text-anchor="middle" fill="currentColor">${pad(h % 24 === 0 && h ? 24 : h)}</text>`; }
  ['Off Duty', 'Sleeper', 'Driving', 'On Duty'].forEach((n, i) => { s += `<line x1="${L}" y1="${T + (i + 1) * rowH}" x2="${W - R}" y2="${T + (i + 1) * rowH}" stroke="currentColor" opacity=".35"/><text x="${L - 6}" y="${y(i) + 4}" font-size="14" text-anchor="end" fill="currentColor">${n}</text>`; });
  let d = ''; segs.filter(g => g.day === day).sort((a, b) => a.a - b.a).forEach((g, i) => { const yy = y(ROW[g.s]); d += (i === 0 ? 'M' : 'L') + x(g.a) + ' ' + yy + ' L' + x(g.b) + ' ' + yy + ' '; });
  if (d) s += `<path d="${d}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>`;
  return s + '</svg>';
}
function logSheetHtml(sh, company, nowMs, extra) {
  const t = stamp(JSON.parse(JSON.stringify(sh)), nowMs), c = JSON.parse(JSON.stringify(sh)); const segs = segments(c, nowMs); const tot = dayTotals(segs); stamp(c, nowMs);
  const days = Object.keys(tot).sort();
  const ruleTxt = sh.rule === 'c2' ? 'Cycle 2 — 120 h / 14 days' : 'Alberta / Canada Cycle 1 — 70 h / 7 days';
  const evs = (sh.events || []).slice().sort((a, b) => new Date(a.t) - new Date(b.t));
  return `<div class="logsheet"><h3 style="margin:0 0 6px">Driver Daily Log</h3>${companyHeaderHtml(sh, company)}<div class="small">Rules: ${ruleTxt} · Date ${esc(sh.date)} (24 h clock) · Odometer ${esc(sh.startOdo)} → ${esc(sh.endOdo === '' ? '—' : sh.endOdo)} km</div>
  ${days.map(dy => `<div style="margin-top:10px"><b>${dy}</b><div class="gw">${gridSvg(dy, segs)}</div><div class="small">Off ${fmtH(tot[dy].OFF)} · Sleeper ${fmtH(tot[dy].SB)} · Driving ${fmtH(tot[dy].D)} · On duty ${fmtH(tot[dy].ON)}</div></div>`).join('')}
  <h4 style="margin:14px 0 6px">Duty status changes</h4><table class="ev"><tr><th>Time</th><th>Status</th><th>Location</th><th>Note</th></tr>${evs.map(e => `<tr><td>${esc(e.hm)}</td><td>${esc(e.label || STATUS[e.s])}</td><td>${esc(e.place || '')}</td><td>${esc(e.note || '')}</td></tr>`).join('')}</table>
  ${(sh.trips || []).length ? `<h4 style="margin:14px 0 6px">Trips</h4>${sh.trips.map(x => `<div>${esc(x.loadId)} ${x.customer ? '· ' + esc(x.customer) : ''}</div>`).join('')}` : ''}
  ${(sh.fuel || []).length ? `<h4 style="margin:14px 0 6px">Fuel</h4>${sh.fuel.map(f => `<div>${esc(f.litres)} L · $${esc(f.cost)} · ${esc(f.place || '')} ${esc(f.note || '')}</div>`).join('')}` : ''}

}

        <div class="row2"><div><label>Licence number</label><input id="dfLic" value="${esc(d.licenseNo)}"></div><div><label>Licence expiry</label><input id="dfExp" type="date" value="${esc(d.licenseExpiry)}"></div></div>
        <label>Licence photo link (Drive link)</label><input id="dfLink" value="${esc(d.licenseLink)}" placeholder="https://drive.google.com/…"><div class="small">Photo upload straight from the phone comes in the next release; paste a Drive link for now.</div>
        <label>Expense notes</label><textarea id="dfNotes">${esc(d.expenseNotes)}</textarea><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="dfAct" style="width:24px;min-height:24px;margin:0" ${d.active !== false ? 'checked' : ''}> Active (can log in)</label>
        <div class="err" id="dfErr"></div><div class="btnrow"><button class="btn btn-outline" id="dfNo">Cancel</button><button class="btn" id="dfOk">Save driver</button></div>`, box => {
        $('dfNo').onclick = closeSheet;
        $('dfOk').onclick = async () => {
          const r = await adminApi('adminSaveDriver', { driver: { id: d.id, name: $('dfName').value, passcode: $('dfPass').value, licenseNo: $('dfLic').value, licenseExpiry: $('dfExp').value, licenseLink: $('dfLink').value, expenseNotes: $('dfNotes').value, active: $('dfAct').checked } });
          if (r.status === 'ok') { admin.drivers = r.drivers; closeSheet(); drawDrivers(); } else $('dfErr').textContent = r.message || 'Could not save.';
        };
      });
    }
    $('urlUpd').onclick = () => { const u = $('urlSet').value.trim(); if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u)) { $('stMsg').textContent = 'That is not a script link.'; return; } URL_ = u; LS.set('kfDrvUrl', u); $('stMsg').textContent = 'Saved on this phone.'; $('stMsg').style.color = 'var(--good)'; };
    $('pwChg').onclick = () => openSheet(`<h3>Change admin password</h3><label>Current password</label><input id="pcOld" type="password"><label>New password</label><input id="pcNew" type="password"><label>Confirm new password</label><input id="pcNew2" type="password"><div class="err" id="pcErr"></div><div class="btnrow"><button class="btn btn-outline" id="pcNo">Cancel</button><button class="btn" id="pcOk">Change</button></div>`, box => {
      $('pcNo').onclick = closeSheet; $('pcOk').onclick = async () => { if ($('pcNew').value !== $('pcNew2').value) { $('pcErr').textContent = 'New passwords do not match.'; return; } const r = await api({ action: 'adminSetPassword', password: $('pcOld').value, newPassword: $('pcNew').value }); if (r.status === 'ok') { SS.set('kfDrvAdmin', $('pcNew').value); closeSheet(); $('stMsg').textContent = 'Admin password changed.'; } else $('pcErr').textContent = r.status === 'badpassword' ? 'Current password is wrong.' : (r.message || 'Could not change.'); };
    });
  });
}

/* ============================== boot ============================== */
(function boot() {
  const h = (location.hash || '').replace('#', ''); tab = ['admin', 'settings'].includes(h) ? h : 'drivers';
  showTab(tab);
  if (shift && session && !shift.submittedPending) { pushShift(); }
  const n = $('companyNameBanner'); const s = mainSettings(); if (n && s.companyName) n.textContent = s.companyName;
})();
</script>
</body>
</html>
