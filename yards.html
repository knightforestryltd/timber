<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yard Inventory</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script src="nav.js"></script>
<style>
.container { max-width: 700px; margin: 0 auto; padding: 12px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
h1, h2, h3 { margin: 0 0 12px; }
.form-group { margin-bottom: 12px; }
label { display: block; margin-bottom: 4px; font-size: .9rem; }
input, select, textarea { width: 100%; padding: 12px; min-height: 46px; }
.species-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
.species-card:hover { border-color: var(--primary-light); }
.load-in { background: var(--surface); }
.load-out { background: var(--out-bg); }
.load-adjust { background: var(--adj-bg); }
.load-row { padding: 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); }
.hidden { display: none; }
@media (max-width: 700px) { .container { padding: 8px; } }
</style>

</head>
<body>
<header style="background:#0f172a;color:white;padding:8px 10px;position:sticky;top:0;z-index:100;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;">
  <div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <a href="#" onclick="showSettings();return false;" id="nav-settings" style="color:white;text-decoration:none;padding:6px;border-radius:6px;background:rgba(255,255,255,0.15);display:flex;align-items:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      <h1 id="companyNameBanner" style="margin:0;font-size:1rem;font-weight:700;letter-spacing:1px;">Knight Forestry Ltd</h1>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">
      <a href="index.html" onclick="location.replace('index.html');return false;" id="nav-quote" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Quote</a>
      <a href="dispatch.html" onclick="location.replace('dispatch.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Dispatch</a>
      <a href="invoices.html" onclick="location.replace('invoices.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Billing</a>
      <a href="scale.html" onclick="location.replace('scale.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Tickets</a>
      <a href="drivers.html" onclick="location.replace('drivers.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Drivers</a>
      <a href="#" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Trucks</a>
      <a href="yards.html" onclick="location.replace('yards.html');return false;" style="color:white;text-decoration:none;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.15);font-size:0.7rem;text-align:center;">Inventory</a>
    </div>
  </div>
  <img id="companyLogo" src="logo.jpg" alt="Logo" style="width:70px;height:70px;border-radius:8px;object-fit:contain;">
</header>
<div class="container">
  <div id="menuScreen">
    <div class="card">
      <h2>Yards</h2>
      <div id="yardList"></div>
      <button class="menu-item" onclick="showAddYard()">Add New Yard</button>
      <button class="menu-item" onclick="showTransfer()">Inventory Transfer</button>
      <button class="menu-item" onclick="showManual()">Manual Adjustment</button>
      <button class="menu-item" onclick="showSettings()">Settings</button>
    </div>
  </div>

  <div id="yardScreen" class="hidden">
    <div class="card">
      <button class="btn btn-outline btn-sm" onclick="showMenu()">← Back</button>
      <h2 id="yardTitle"></h2>
      <div id="yardSpecies"></div>
    </div>
  </div>

  <div id="speciesScreen" class="hidden">
    <div class="card">
      <button class="btn btn-outline btn-sm" onclick="showYard(currentYard)">← Back</button>
      <h2 id="speciesTitle"></h2>
      <div id="speciesSummary"></div>
      <div id="speciesLoads"></div>
    </div>
  </div>

  <div id="transferScreen" class="hidden">
    <div class="card">
      <button class="btn btn-outline btn-sm" onclick="showMenu()">← Back</button>
      <h2>Inventory Transfer</h2>
      <div class="form-group"><label>Pickup Location</label><select id="tfPickup"></select></div>
      <div class="form-group"><label>Species</label><input id="tfSpecies" placeholder="Birch"></div>
      <div class="form-group"><label>Price per Tonne</label><input type="number" id="tfPriceT" step="0.01"></div>
      <div class="form-group"><label>Or Price per Cord</label><input type="number" id="tfPriceC" step="0.01"></div>
      <div class="form-group"><label>t/cord (CVF)</label><input type="number" id="tfCvf" step="0.1" value="1.75"></div>
      <div class="form-group"><label>Delivery Yard</label><select id="tfYard"></select></div>
      <div class="form-group"><label>Haul Unit</label><input id="tfUnit" placeholder="Full truck"></div>
      <div class="form-group"><label>Tonnes</label><input type="number" id="tfTonnes" step="0.1"></div>
      <button class="btn" onclick="generateTransferCost()">Generate Cost</button>
      <div id="tfCost" style="margin:12px 0; font-weight:600;"></div>
      <button class="btn" onclick="bookTransfer()">Book Trip (save to quote sheet)</button>
      <div class="form-group" style="margin-top:16px;"><label>Scale Ticket # to complete</label><input id="tfTicket" placeholder="Ticket number"></div>
      <button class="btn" onclick="completeTransfer()">Complete Transfer</button>
    </div>
  </div>

  <div id="manualScreen" class="hidden">
    <div class="card">
      <button class="btn btn-outline btn-sm" onclick="showMenu()">← Back</button>
      <h2>Manual Adjustment</h2>
      <div id="manualLock">
        <div class="form-group"><label>Password required</label><input type="password" id="manualPass" placeholder="Password"></div>
        <button class="btn" onclick="unlockManual()">Unlock</button>
      </div>
      <div id="manualForm" class="hidden">
      <div class="form-group"><label>Yard</label><select id="manYard"></select></div>
      <div class="form-group"><label>Species</label><input id="manSpecies" placeholder="Birch"></div>
      <div class="form-group"><label>Tonnes (+ or -)</label><input type="number" id="manTonnes" step="0.1"></div>
      <div class="form-group"><label>Price per Tonne</label><input type="number" id="manPrice" step="0.01"></div>
      <div class="form-group"><label>Notes</label><input id="manNotes" placeholder="Shrinkage / new stock"></div>
      <button class="btn" onclick="saveManual()">Save Adjustment</button>
      </div>
    </div>
  </div>

  <div id="addYardScreen" class="hidden">
    <div class="card">
      <button class="btn btn-outline btn-sm" onclick="showMenu()">← Back</button>
      <h2>Add New Yard</h2>
      <div class="form-group"><label>Yard Name</label><input id="newYardName" placeholder="Knight Yard"></div>
      <div class="form-group"><label>Starting Species</label><input id="newYardSpecies" placeholder="Birch"></div>
      <div class="form-group"><label>Starting Tonnes</label><input type="number" id="newYardTonnes" step="0.1" value="0"></div>
      <button class="btn" onclick="addNewYard()">Add Yard</button>
    </div>
  </div>

  <div id="settingsScreen" class="hidden">
    <div class="card">
      <button class="btn btn-outline btn-sm" onclick="showMenu()">← Back</button>
      <h2>Yard Settings</h2>
      <div class="form-group"><label>Yard Inventory Sheet URL</label><input id="yardUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div class="form-group"><label>New Password</label><input type="password" id="newPass" placeholder="Leave blank to keep"></div>
      <button class="btn" onclick="saveYardSettings()">Save</button>
    </div>
  </div>
</div>

<script>
let YARD_URL = localStorage.getItem('yardUrl') || '';
let YARD_PASS = localStorage.getItem('yardPass') || 'knight';
let inventory = [];
let currentYard = '';
let currentSpecies = '';

loadInventory();

function showMenu() {
  hideAll();
  document.getElementById('menuScreen').classList.remove('hidden');
  renderYardList();
}

function showYard(name) {
  currentYard = name;
  hideAll();
  document.getElementById('yardScreen').classList.remove('hidden');
  document.getElementById('yardTitle').textContent = name;
  renderYardSpecies(name);
}

function showSpecies(yard, species) {
  currentYard = yard;
  currentSpecies = species;
  hideAll();
  document.getElementById('speciesScreen').classList.remove('hidden');
  document.getElementById('speciesTitle').textContent = yard + ' — ' + species;
  renderSpeciesDetail(yard, species);
}

function showTransfer() {
  hideAll();
  document.getElementById('transferScreen').classList.remove('hidden');
  fillYardSelects();
}

function showManual() {
  hideAll();
  document.getElementById('manualScreen').classList.remove('hidden');
  document.getElementById('manualLock').classList.remove('hidden');
  document.getElementById('manualForm').classList.add('hidden');
  fillYardSelects();
}

function unlockManual() {
  if (document.getElementById('manualPass').value === YARD_PASS) {
    document.getElementById('manualLock').classList.add('hidden');
    document.getElementById('manualForm').classList.remove('hidden');
  } else alert('Wrong password');
}

function showAddYard() {
  hideAll();
  document.getElementById('addYardScreen').classList.remove('hidden');
}

async function addNewYard() {
  if (!YARD_URL) { alert('Set the yard sheet URL in Settings first.'); return; }
  const name = document.getElementById('newYardName').value.trim();
  if (!name) { alert('Enter a yard name.'); return; }
  const payload = {
    action: 'add',
    timestamp: new Date().toISOString(),
    yard: name,
    species: document.getElementById('newYardSpecies').value || 'Birch',
    type: 'Adjust',
    tonnes: +document.getElementById('newYardTonnes').value || 0,
    notes: 'Yard created'
  };
  try {
    await fetch(YARD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
    // Also add as pickup location for quoting
    try {
      const s = JSON.parse(localStorage.getItem('knightForestrySettings') || '{}');
      if (!s.locations) s.locations = [];
      if (!s.locations.find(l => l.name === name)) {
        s.locations.push({ id: Date.now(), name: name, address: name, species: [{ name: document.getElementById('newYardSpecies').value || 'Birch', price: 0, conv: 1.75 }] });
        localStorage.setItem('knightForestrySettings', JSON.stringify(s));
      }
    } catch(e) {}
    alert('Yard added and available for quoting.');
    loadInventory();
    showMenu();
  } catch(e) { alert('Saved.'); }
}

function showSettings() {
  hideAll();
  document.getElementById('settingsScreen').classList.remove('hidden');
  document.getElementById('yardUrl').value = YARD_URL;
}

// phone back button (nav.js): one level at a time
window.kfBack = function () {
  const vis = id => !document.getElementById(id).classList.contains('hidden');
  if (vis('speciesScreen')) { showYard(currentYard); return true; }
  if (['yardScreen', 'transferScreen', 'manualScreen', 'addYardScreen', 'settingsScreen'].some(vis)) { showMenu(); return true; }
  return false;
};
function hideAll() {
  ['menuScreen','yardScreen','speciesScreen','transferScreen','manualScreen','addYardScreen','settingsScreen'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
}

async function loadInventory() {
  if (!YARD_URL) return;
  try {
    const res = await fetch(YARD_URL);
    const data = await res.json();
    inventory = data.rows || [];
    renderYardList();
  } catch (e) { console.log(e); }
}

function getYards() {
  const fromSheet = [...new Set(inventory.map(r => r.yard).filter(Boolean))];
  return fromSheet;
}

function renderYardList() {
  const yards = getYards();
  const el = document.getElementById('yardList');
  el.innerHTML = yards.map(y => `<button class="menu-item" onclick="showYard('${y}')">${y}</button>`).join('') || '<p style="color:var(--muted);">No yards yet. Use Manual Adjustment to start one.</p>';
}

function renderYardSpecies(yard) {
  const rows = inventory.filter(r => r.yard === yard);
  const species = [...new Set(rows.map(r => r.species))];
  const el = document.getElementById('yardSpecies');
  if (!species.length) { el.innerHTML = '<p style="color:var(--muted);">No inventory yet.</p>'; return; }
  el.innerHTML = species.map(sp => {
    const loads = rows.filter(r => r.species === sp);
    let tonnes = 0, cost = 0;
    loads.forEach(l => {
      const t = +l.tonnes || 0;
      const sign = l.type === 'Out' ? -1 : 1;
      tonnes += sign * t;
      if (l.type !== 'Out') cost += t * (+l.pricePerTonne || 0);
    });
    const inTonnes = loads.filter(l => l.type !== 'Out').reduce((s,l) => s + (+l.tonnes||0), 0);
    const avg = inTonnes ? (cost / inTonnes).toFixed(0) : 0;
    return `<div class="species-card" onclick="showSpecies('${yard}','${sp}')">
      <strong>${sp}</strong><br>
      Available: ${tonnes.toFixed(1)} t<br>
      Invested: $${avg}/t
    </div>`;
  }).join('');
}

function renderSpeciesDetail(yard, species) {
  const loads = inventory.filter(r => r.yard === yard && r.species === species);
  let tonnes = 0, cost = 0, inT = 0;
  loads.forEach(l => {
    const t = +l.tonnes || 0;
    const sign = l.type === 'Out' ? -1 : 1;
    tonnes += sign * t;
    if (l.type !== 'Out') { cost += t * (+l.pricePerTonne || 0); inT += t; }
  });
  const avg = inT ? (cost / inT).toFixed(0) : 0;
  document.getElementById('speciesSummary').innerHTML = `<p><strong>Available:</strong> ${tonnes.toFixed(1)} t &nbsp; <strong>Avg invested:</strong> $${avg}/t</p>`;
  document.getElementById('speciesLoads').innerHTML = loads.map(l => {
    const cls = l.type === 'Out' ? 'load-out' : (l.type === 'Adjust' ? 'load-adjust' : 'load-in');
    return `<div class="load-row ${cls}">
      <strong>${l.type}</strong> ${l.tonnes} t · ${l.cords||''} cord<br>
      $${l.pricePerTonne||0}/t &nbsp; $${l.pricePerCord||0}/cord<br>
      <small>${l.ticket||''} ${l.source||''} ${l.notes||''}</small>
    </div>`;
  }).join('') || '<p>No loads.</p>';
}

function fillYardSelects() {
  const yards = getYards();
  const opts = yards.map(y => `<option>${y}</option>`).join('');
  ['tfYard','manYard'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts || '<option>No yards</option>';
  });
  // Pickup locations from quoting settings
  try {
    const s = JSON.parse(localStorage.getItem('knightForestrySettings') || '{}');
    const locs = (s.locations || []).map(l => `<option>${l.name}</option>`).join('');
    document.getElementById('tfPickup').innerHTML = locs || '<option>No locations</option>';
  } catch(e) {}
}

function generateTransferCost() {
  const t = +document.getElementById('tfTonnes').value || 0;
  const pt = +document.getElementById('tfPriceT').value || 0;
  document.getElementById('tfCost').textContent = 'Material cost: $' + (t * pt).toFixed(0);
}

async function bookTransfer() {
  // Save a note to quote sheet if webhook exists
  const s = JSON.parse(localStorage.getItem('knightForestrySettings') || '{}');
  if (s.webhook) {
    const payload = {
      timestamp: new Date().toISOString(),
      customerName: 'Inventory Transfer',
      phone: '',
      address: document.getElementById('tfYard').value,
      options: [{
        location: document.getElementById('tfPickup').value,
        species: document.getElementById('tfSpecies').value,
        truck: document.getElementById('tfUnit').value,
        tonnes: document.getElementById('tfTonnes').value,
        total: document.getElementById('tfCost').textContent
      }]
    };
    try { await fetch(s.webhook, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); } catch(e) {}
  }
  alert('Trip booked to quote sheet.');
}

async function completeTransfer() {
  if (!YARD_URL) { alert('Set the yard sheet URL in Settings first.'); return; }
  const tonnes = +document.getElementById('tfTonnes').value || 0;
  const cvf = +document.getElementById('tfCvf').value || 1.75;
  const payload = {
    action: 'add',
    timestamp: new Date().toISOString(),
    yard: document.getElementById('tfYard').value,
    species: document.getElementById('tfSpecies').value,
    type: 'In',
    tonnes: tonnes,
    cords: (tonnes / cvf).toFixed(1),
    pricePerTonne: +document.getElementById('tfPriceT').value || 0,
    pricePerCord: +document.getElementById('tfPriceC').value || 0,
    ticket: document.getElementById('tfTicket').value,
    source: document.getElementById('tfPickup').value,
    unit: document.getElementById('tfUnit').value
  };
  try {
    await fetch(YARD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
    alert('Transfer recorded. Refresh to see it.');
    loadInventory();
    showMenu();
  } catch(e) { alert('Saved (no-cors).'); }
}

async function saveManual() {
  if (!YARD_URL) { alert('Set the yard sheet URL in Settings first.'); return; }
  const tonnes = +document.getElementById('manTonnes').value || 0;
  const payload = {
    action: 'add',
    timestamp: new Date().toISOString(),
    yard: document.getElementById('manYard').value,
    species: document.getElementById('manSpecies').value,
    type: 'Adjust',
    tonnes: tonnes,
    pricePerTonne: +document.getElementById('manPrice').value || 0,
    notes: document.getElementById('manNotes').value
  };
  try {
    await fetch(YARD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
    alert('Adjustment saved.');
    loadInventory();
    showMenu();
  } catch(e) { alert('Saved (no-cors).'); }
}

function saveYardSettings() {
  const url = document.getElementById('yardUrl').value.trim();
  if (url) { YARD_URL = url; localStorage.setItem('yardUrl', url); localStorage.setItem('yardUrlAt', String(Date.now())); localStorage.setItem('kfDirty', '1'); }
  const np = document.getElementById('newPass').value.trim();
  if (np) { YARD_PASS = np; localStorage.setItem('yardPass', np); }
  alert('Settings saved.');
  showMenu();
}
</script>

<script>
(function() {
  const co = JSON.parse(localStorage.getItem('kfCompany') || '{}');
  const logoEl = document.getElementById('companyLogo');
  if (logoEl && co.logo) logoEl.src = co.logo;
  const nameEl = document.getElementById('companyNameBanner');
  if (nameEl && co.name) nameEl.textContent = co.name;
})();
</script>
</body>
</html>
